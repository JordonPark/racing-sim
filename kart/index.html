<title>토이 카트 랠리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-screen 3D canvas; chunky toy-box HUD floats on top (lap/time top-left, item slot top-center, position + minimap top-right, touch pads bottom). Single bright look by design. */
:root {
  color-scheme: dark;
  --ink: #1d1235;
  --cream: #fff6e6;
  --sun: #ffd23f;
  --berry: #ff4f8b;
  --sky: #3fa9ff;
  --leaf: #38c172;
  --grape: #8f5bff;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
body {
  font-family: var(--font); color: var(--cream);
  -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none;
}
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.stroke { -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }

/* ── toy UI ── */
.tbtn {
  background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 5px 0 var(--ink); padding: 12px 22px; font-size: 20px; line-height: 1.1; transition: transform .06s, box-shadow .06s;
}
.tbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.tbtn.alt { background: var(--cream); }
.tbtn.pink { background: var(--berry); color: #fff; }
.tbtn.blue { background: var(--sky); color: #fff; }
.card {
  background: var(--cream); color: var(--ink); border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 8px 0 var(--ink); padding: 20px; width: min(760px, 100%);
}
#ui {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; overflow-y: auto; touch-action: pan-y;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#ui.dim { background: rgba(29, 18, 53, .55); }
.title { display: grid; justify-items: center; gap: 18px; text-align: center; }
.logo { font-size: clamp(54px, 13vw, 120px); line-height: .95; color: var(--sun); margin: 0; transform: rotate(-3deg); }
.logo span { display: block; color: var(--berry); font-size: .62em; transform: rotate(4deg); margin-bottom: .12em; }
.logo .stroke { -webkit-text-stroke: 10px var(--ink); }
.tagline { margin: 0; font-size: 18px; color: #fff; text-shadow: 0 2px 0 var(--ink); max-width: 30ch; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
h2 { margin: 0 0 10px; font-size: 26px; font-weight: 400; }
h3 { margin: 14px 0 8px; font-size: 18px; font-weight: 400; color: #5a4c78; }
.racers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.racer {
  background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 6px 10px; display: grid; justify-items: center; gap: 4px;
  box-shadow: 0 4px 0 var(--ink); color: var(--ink);
}
.racer.on { background: var(--sun); transform: translateY(-3px); }
.racer .face { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--ink); position: relative; }
.racer .face::after { content: ""; position: absolute; left: 8px; right: 8px; top: 15px; height: 9px; border-radius: 5px; background: var(--ink); }
.racer b { font-weight: 400; font-size: 17px; }
.stat { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 4px; width: 100%; font-size: 11px; color: #6b5d87; }
.stat i { display: block; height: 6px; border-radius: 3px; background: #e9e1f5; overflow: hidden; }
.stat i::before { content: ""; display: block; height: 100%; width: var(--v); background: var(--berry); }
.seg { display: flex; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px 8px; font-size: 16px; color: var(--ink); border-right: 3px solid var(--ink); min-height: 44px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--sky); color: #fff; }
.tracks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.trk { border: 3px solid var(--ink); border-radius: 14px; padding: 10px; text-align: left; color: var(--ink); box-shadow: 0 4px 0 var(--ink); min-height: 64px; }
.trk small { display: block; font-size: 12px; opacity: .75; }
.trk.on { outline: 4px solid var(--berry); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--berry); }
.res { width: 100%; border-collapse: collapse; font-size: 17px; color: var(--ink); font-family: var(--font); }
.res td { padding: 6px 6px; border-bottom: 2px dashed #d9cdea; }
.res tr.me td { background: #ffe9a3; }
.res .p { width: 44px; font-size: 22px; }
.res .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); vertical-align: -1px; margin-right: 6px; }
.res .r { text-align: right; font-variant-numeric: tabular-nums; }
.help-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 16px; line-height: 1.45; }
.kbd { background: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; font-size: 14px; }

/* ── HUD ── */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.hud-tl { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: flex-start; }
.hud-tr { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: grid; justify-items: end; gap: 6px; }
.hud-tc { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; }
.lapbox { font-size: 22px; line-height: 1; color: #fff; }
.lapbox b { font-size: 34px; font-weight: 400; }
.timer { font-size: 18px; color: #fff; font-variant-numeric: tabular-nums; }
#pos { font-size: 72px; line-height: .9; color: var(--sun); }
#pos sup { font-size: 26px; vertical-align: top; margin-left: 2px; }
#map { width: 110px; height: 110px; }
#itemslot {
  width: 74px; height: 74px; border-radius: 50%; background: rgba(255, 246, 230, .9); border: 4px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center;
}
#itemslot svg { width: 50px; height: 50px; }
#gems { font-size: 18px; color: #fff; }
#gems i { display: inline-block; width: 13px; height: 13px; background: #49e4ff; transform: rotate(45deg); border: 2px solid var(--ink); margin-right: 6px; }
#pauseBtn {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); color: var(--ink);
  box-shadow: 0 3px 0 var(--ink); font-size: 18px;
}
#banner {
  position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(54px, 14vw, 120px); color: var(--sun);
  opacity: 0; transform: scale(.6);
}
#banner.show { animation: pop 1.1s ease-out forwards; }
#banner.small { font-size: clamp(30px, 7vw, 56px); color: #fff; }
@keyframes pop { 0% { opacity: 0; transform: scale(.5); } 15% { opacity: 1; transform: scale(1.12); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
#warn { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 26px; color: var(--berry); display: none; }
.speedo { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: 20px; color: #fff; }
.keys { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); font-size: 14px; color: #fff; text-shadow: 0 2px 0 var(--ink); }

/* touch pads */
#touch { display: none; }
.touch #touch { display: block; }
.touch .keys { display: none; }
.pad {
  pointer-events: auto; position: absolute; border-radius: 50%; border: 4px solid var(--ink); background: rgba(255, 246, 230, .78);
  color: var(--ink); display: grid; place-items: center; font-size: 30px; box-shadow: 0 5px 0 var(--ink); touch-action: none;
}
.pad.held { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); background: var(--sun); }
#bL { left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 82px; height: 82px; }
#bR { left: calc(108px + env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 82px; height: 82px; }
#bDrift { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 96px; font-size: 19px; background: rgba(255, 79, 139, .85); color: #fff; }
#bItem { right: calc(120px + env(safe-area-inset-right, 0px)); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width: 70px; height: 70px; font-size: 16px; }
#bBrake { right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: 14px; }
.touch .speedo { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }

#panel {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: auto;
  display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center;
  background: rgba(255, 246, 230, .93); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
  padding: 8px 10px; width: max-content; max-width: calc(100vw - 20px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
}
.pgroup { display: flex; align-items: center; gap: 6px; }
.plabel { font-size: 14px; color: #5a4c78; }
.seg.mini button { padding: 6px 10px; font-size: 15px; min-height: 42px; min-width: 50px; }
.seg.mini button.on.attack { background: var(--berry); } .seg.mini button.on.safe { background: var(--leaf); }
.tbtn.mini { white-space: nowrap; padding: 8px 12px; font-size: 15px; box-shadow: 0 3px 0 var(--ink); border-radius: 12px; min-height: 42px; }
.tbtn.mini:disabled { opacity: .45; }
#autoBtn { background: var(--leaf); color: #fff; } #autoBtn.off { background: #d9cdea; color: var(--ink); }
#feed {
  position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: 120px;
  display: grid; gap: 4px; max-width: min(380px, 72vw); font-size: 15px; justify-items: start;
}
#feed div { background: rgba(29, 18, 53, .78); color: #fff; padding: 4px 10px; border-radius: 10px; border-left: 5px solid var(--sky); animation: feedin .25s ease-out; }
#feed div.good { border-left-color: var(--leaf); } #feed div.bad { border-left-color: var(--berry); } #feed div.item { border-left-color: var(--sun); }
@keyframes feedin { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.setup2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
.hint { margin: 6px 0 0; font-size: 13px; color: #6b5d87; }
@media (max-width: 640px) { .setup2 { grid-template-columns: minmax(0, 1fr); } .pgroup.lab { flex-direction: column; gap: 2px; } .plabel { font-size: 12px; line-height: 1; } .seg.mini button { min-width: 44px; padding: 6px 8px; } .tbtn.mini { padding: 8px 9px; } #panel { gap: 6px 10px; } }

@media (max-width: 640px) {
  .racers { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .racer .face { width: 34px; height: 34px; }
  .racer .face::after { top: 11px; height: 7px; left: 6px; right: 6px; }
  .stat { display: none; }
  .tracks { grid-template-columns: minmax(0, 1fr); }
  #pos { font-size: 56px; }
  #map { width: 84px; height: 84px; }
  #itemslot { width: 62px; height: 62px; } #itemslot svg { width: 42px; height: 42px; }
  .lapbox b { font-size: 28px; }
}
@media (max-height: 500px) {
  #pos { font-size: 50px; } #pos sup { font-size: 20px; }
  #map { width: 76px; height: 76px; }
  #itemslot { width: 58px; height: 58px; } #itemslot svg { width: 40px; height: 40px; }
  .lapbox b { font-size: 26px; }
  #bBrake { bottom: calc(126px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { #banner.show { animation-duration: .01s; opacity: 1; transform: none; } .tbtn { transition: none; } }
</style>

<canvas id="c" aria-label="레이스 화면"></canvas>

<div id="hud" hidden>
  <div class="hud-tl">
    <button id="pauseBtn" aria-label="일시정지">II</button>

      <div class="lapbox stroke">LAP <b id="lap">1</b>/3</div>

    </div>
  </div>
</div>

<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
if (!window.THREE) {
  $("ui").innerHTML = '<div class="card"><h2>3D 엔진을 불러오지 못했어요</h2><p>네트워크를 확인하고 새로고침해 주세요.</p></div>';
  throw new Error("three.js not loaded");
}
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
if (isTouch) document.body.classList.add("touch");

// ═════════════ 데이터 ═════════════
const RACERS = [
  { name: "볼트", color: 0xff4d4d, helmet: 0xffffff, speed: 1.03, accel: 0.94, handling: 0.95 },
  { name: "미미", color: 0xff8fd0, helmet: 0xfff1a8, speed: 0.97, accel: 1.06, handling: 1.05 },
  { name: "카이", color: 0x3fa9ff, helmet: 0xffffff, speed: 1.00, accel: 1.00, handling: 1.00 },
  { name: "루루", color: 0xffd23f, helmet: 0xff7a3d, speed: 0.98, accel: 1.04, handling: 1.03 },
  { name: "덕구", color: 0xa86b3c, helmet: 0xffe0b0, speed: 1.04, accel: 0.92, handling: 0.94 },
  { name: "피코", color: 0x38c172, helmet: 0xffffff, speed: 0.99, accel: 1.02, handling: 1.04 },
  { name: "젤리", color: 0x8f5bff, helmet: 0xc9f2ff, speed: 1.01, accel: 0.99, handling: 1.00 },
  { name: "토토", color: 0xff9f1c, helmet: 0x2b2b44, speed: 1.00, accel: 1.03, handling: 0.98 },
];
const THEMES = {
  meadow: { sky: 0x8fd8ff, fog: 0xcdeeff, grass: 0x5fd35b, ground: 0x4fb84c, road: "#5a5e70", accent: 0xff4f8b, deco: "tree", hill: 0x6bd36a, label: "#38c172" },
  canyon: { sky: 0xffbf86, fog: 0xffdcb8, grass: 0xe9a463, ground: 0xd98b4e, road: "#5e4b4a", accent: 0x3fa9ff, deco: "rock", hill: 0xcf6f3c, label: "#ff9f1c" },
  snow: { sky: 0xa9cdfa, fog: 0xe6f0ff, grass: 0xf4f8ff, ground: 0xe3ecf8, road: "#4c5770", accent: 0xff4f8b, deco: "pine", hill: 0xffffff, label: "#3fa9ff" },
};
const TRACKS = [
  { name: "선샤인 초원", sub: "완만한 언덕, 첫 레이스용", theme: "meadow",
    pts: [[0, 0, 0], [90, 0, 0], [150, 3, 40], [160, 6, 110], [110, 8, 160], [40, 5, 140], [0, 2, 190], [-80, 0, 190], [-140, 0, 130], [-120, 0, 60], [-60, 0, 40]] },
  { name: "선셋 캐니언", sub: "급커브와 고갯길", theme: "canyon",
    pts: [[0, 0, 0], [100, 0, -20], [170, 6, 20], [150, 12, 90], [80, 14, 80], [60, 10, 140], [120, 6, 190], [60, 2, 250], [-40, 0, 230], [-90, 4, 160], [-40, 8, 110], [-100, 4, 50], [-60, 0, 0]] },
  { name: "스노우 피크", sub: "높은 고개, 긴 코스", theme: "snow",
    pts: [[0, 0, 0], [120, 0, 0], [180, 5, -50], [240, 10, 0], [220, 14, 80], [150, 16, 100], [90, 12, 60], [40, 8, 110], [60, 4, 180], [-20, 2, 220], [-100, 0, 180], [-130, 2, 100], [-80, 4, 50]] },
];
const CC = { 50: { max: 30, ai: [0.88, 0.94] }, 100: { max: 37, ai: [0.92, 0.98] }, 150: { max: 44, ai: [0.95, 1.0] } };
const LAPS = 3;
const W = 16;            // 도로 폭
const WALL = W / 2 + 10; // 바깥 벽
const GP_POINTS = [15, 12, 10, 8, 6, 4, 2, 1];
const ENGINES = { speed: { name: "스피드형", sp: 0.03, ac: -0.07, hd: 0, off: 0, desc: "최고 속도↑ 가속↓" }, mid: { name: "균형형", sp: 0, ac: 0, hd: 0, off: 0, desc: "무난함" }, accel: { name: "가속형", sp: -0.02, ac: 0.08, hd: 0, off: 0, desc: "가속↑ 충돌 후 회복 빠름" } };
const TIRES = { grip: { name: "그립", sp: -0.01, ac: 0, hd: 0.07, off: 0.04, desc: "코너링↑ 잔디에서 덜 느림" }, std: { name: "표준", sp: 0, ac: 0, hd: 0, off: 0, desc: "무난함" }, slick: { name: "슬릭", sp: 0.02, ac: 0, hd: -0.06, off: -0.06, desc: "직선↑ 코너·잔디↓" } };
const STYLES = { attack: { name: "공격", mul: 1.055, driftAt: 0.4, mistake: 0.02, driftRate: 5 }, balanced: { name: "균형", mul: 1.0, driftAt: 0.45, mistake: 0.008, driftRate: 4 }, safe: { name: "안정", mul: 0.982, driftAt: 0.5, mistake: 0.002, driftRate: 4 } };
const PLANS = { attack: "공격", balanced: "균형", defend: "방어" };
const ITEMS = ["nitro", "triple", "oil", "rocket", "shield"];
const ITEM_NAME = { nitro: "니트로", triple: "니트로 ×3", oil: "오일 웅덩이", rocket: "추적 로켓", shield: "방패 버블" };

// ═════════════ 설정 / 상태 ═════════════
const S = {
  state: "attract",
  sel: { racer: 2, cc: 100, mode: "race", track: 0, sound: true, engine: "mid", tire: "std", style: "balanced", plan: "balanced", speed: 1, cam: "chase", autoItem: true },
  gp: null,
  trackIdx: 0,
  paused: false,
  raceTime: 0,
  countdown: 0,
  finishT: 0,
  ccMax: 37,
};
try { Object.assign(S.sel, JSON.parse(localStorage.getItem("tkr-sel") || "{}")); } catch (e) { /* 저장소 없음 */ }
const saveSel = () => { try { localStorage.setItem("tkr-sel", JSON.stringify(S.sel)); } catch (e) { /* 무시 */ } };

// ═════════════ 렌더러 ═════════════
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !isTouch, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, 1, 0.5, 1500);
let baseFov = 70;
scene.add(new THREE.HemisphereLight(0xffffff, 0x7a6a50, 0.78));
const sunLight = new THREE.DirectionalLight(0xffffff, 0.72);
sunLight.position.set(120, 220, 80);
scene.add(sunLight);

  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;

}

const V3 = THREE.Vector3;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const lerp = (a, b, t) => a + (b - a) * t;
const phong = (c, extra) => new THREE.MeshPhongMaterial(Object.assign({ color: c, flatShading: true, shininess: 20 }, extra || {}));

function canvasTex(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

// ═════════════ 트랙 ═════════════
let TR = null;
const trackGroup = new THREE.Group();
scene.add(trackGroup);

function disposeGroup(g) {
  g.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach((m) => { if (m.map) m.map.dispose(); m.dispose(); });
    }
  });
  while (g.children.length) g.remove(g.children[0]);
}

function buildTrack(idx) {
  disposeGroup(trackGroup);
  const def = TRACKS[idx], th = THEMES[def.theme];
  scene.background = new THREE.Color(th.sky);
  scene.fog = new THREE.Fog(th.fog, 140, 520);
  const curve = new THREE.CatmullRomCurve3(def.pts.map((p) => new V3(p[0], p[1], p[2])), true, "centripetal");
  const len = curve.getLength();
  const N = Math.round(len / 2);
  const P = curve.getSpacedPoints(N);
  P.pop();
  const T = [], NR = [];
  for (let i = 0; i < N; i++) {
    const a = P[(i - 1 + N) % N], b = P[(i + 1) % N];
    const t = new V3(b.x - a.x, 0, b.z - a.z).normalize();
    T.push(t);
    NR.push(new V3(-t.z, 0, t.x));
  }
  TR = { idx, def, th, N, P, T, NR, len, boxes: [], gems: [], minimap: null };

  // 리본 메시 (도로, 연석, 잔디)
  const ribbon = (offA, offB, yA, yB, mat, vLen) => {
    const pos = [], uv = [], ind = [];
    for (let i = 0; i <= N; i++) {
      const k = i % N, p = P[k], n = NR[k];
      const ya = typeof yA === "function" ? yA(p) : p.y + yA;
      const yb = typeof yB === "function" ? yB(p) : p.y + yB;
      pos.push(p.x + n.x * offA, ya, p.z + n.z * offA, p.x + n.x * offB, yb, p.z + n.z * offB);
      const v = (i * 2) / vLen;
      uv.push(0, v, 1, v);
      if (i < N) { const a = i * 2; ind.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    g.setIndex(ind);
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat);
    trackGroup.add(m);
    return m;
  };
  const roadTex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = th.road; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(255,255,255,${Math.random() * 0.07})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
    g.fillStyle = "#ffffff"; g.fillRect(6, 0, 7, h); g.fillRect(w - 13, 0, 7, h);
    g.fillStyle = "rgba(255,255,255,.75)"; g.fillRect(w / 2 - 4, 0, 8, h / 2);
  });
  const curbTex = canvasTex(32, 64, (g, w, h) => {
    g.fillStyle = "#ff3b4e"; g.fillRect(0, 0, w, h / 2);
    g.fillStyle = "#ffffff"; g.fillRect(0, h / 2, w, h / 2);
  });
  const roadMat = new THREE.MeshLambertMaterial({ map: roadTex, side: THREE.DoubleSide });
  const curbMat = new THREE.MeshLambertMaterial({ map: curbTex, side: THREE.DoubleSide });
  const grassMat = new THREE.MeshLambertMaterial({ color: th.grass, side: THREE.DoubleSide });
  ribbon(-W / 2, W / 2, 0.06, 0.06, roadMat, 10);
  ribbon(-W / 2 - 1.4, -W / 2, 0.08, 0.08, curbMat, 4);
  ribbon(W / 2, W / 2 + 1.4, 0.08, 0.08, curbMat, 4);
  ribbon(-W / 2 - 22, -W / 2 - 1.4, 0, 0, grassMat, 10);
  ribbon(W / 2 + 1.4, W / 2 + 22, 0, 0, grassMat, 10);
  ribbon(-W / 2 - 50, -W / 2 - 22, () => -2, 0, grassMat, 10);
  ribbon(W / 2 + 22, W / 2 + 50, 0, () => -2, grassMat, 10);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshLambertMaterial({ color: th.ground }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2.05;
  trackGroup.add(ground);

  // 경계 범퍼
  const bump = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.7, 0.7, 1.1, 8), phong(0xffffff), Math.ceil(N / 5) * 2);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  let bi = 0;
  for (let i = 0; i < N; i += 5) {
    for (const side of [-1, 1]) {
      const p = P[i], n = NR[i];
      m4.makeTranslation(p.x + n.x * side * (WALL + 0.6), p.y + 0.5, p.z + n.z * side * (WALL + 0.6));
      bump.setMatrixAt(bi, m4);
      bump.setColorAt(bi, col.setHex((i / 5) % 2 ? th.accent : 0xffffff));
      bi++;
    }
  }
  bump.count = bi;
  trackGroup.add(bump);

  // 출발선 + 아치
  {
    const p = P[0], t = T[0];
    const ang = Math.atan2(t.x, t.z);
    const g = new THREE.Group();
    g.position.set(p.x, p.y, p.z);
    g.rotation.y = ang;
    const checker = canvasTex(128, 32, (c, w, h) => {
      for (let x = 0; x < 16; x++) for (let y = 0; y < 4; y++) { c.fillStyle = (x + y) % 2 ? "#111" : "#fff"; c.fillRect(x * 8, y * 8, 8, 8); }
    });
    const line = new THREE.Mesh(new THREE.PlaneGeometry(W, 2.4), new THREE.MeshLambertMaterial({ map: checker }));
    line.rotation.x = -Math.PI / 2;
    line.position.y = 0.1;
    g.add(line);
    const pillarM = phong(th.accent);
    for (const s of [-1, 1]) {
      const pil = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 8, 8), pillarM);
      pil.position.set(s * (W / 2 + 2.5), 4, 0);
      g.add(pil);
      const ball = new THREE.Mesh(new THREE.SphereGeometry(1.1, 10, 8), phong(0xffd23f));
      ball.position.set(s * (W / 2 + 2.5), 8.6, 0);
      g.add(ball);
    }
    const banner = canvasTex(512, 96, (c, w, h) => {
      c.fillStyle = "#ffd23f"; c.fillRect(0, 0, w, h);
      c.fillStyle = "#1d1235"; c.font = "bold 58px Jua, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
      c.fillText("TOY KART RALLY", w / 2, h / 2 + 4);
    });
    banner.wrapS = banner.wrapT = THREE.ClampToEdgeWrapping;
    const top = new THREE.Mesh(new THREE.BoxGeometry(W + 6, 2.2, 0.6), [phong(0xffd23f), phong(0xffd23f), phong(0xffd23f), phong(0xffd23f), new THREE.MeshLambertMaterial({ map: banner }), new THREE.MeshLambertMaterial({ map: banner })]);
    top.position.set(0, 7.2, 0);
    g.add(top);
    trackGroup.add(g);
  }

  // 장식
  const xs = P.map((p) => p.x), zs = P.map((p) => p.z);
  const minX = Math.min(...xs) - 140, maxX = Math.max(...xs) + 140, minZ = Math.min(...zs) - 140, maxZ = Math.max(...zs) + 140;
  const farFromTrack = (x, z, d) => { for (let i = 0; i < N; i += 2) { const p = P[i]; if ((p.x - x) ** 2 + (p.z - z) ** 2 < d * d) return false; } return true; };
  const spots = [];
  for (let tries = 0; spots.length < 230 && tries < 3000; tries++) {
    const x = lerp(minX, maxX, Math.random()), z = lerp(minZ, maxZ, Math.random());
    if (farFromTrack(x, z, WALL + 6)) {
      let ny = -2, best = Infinity;
      for (let i = 0; i < N; i += 4) { const p = P[i], d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < best) { best = d; ny = p.y; } }
      const dist = Math.sqrt(best);
      const y = dist < W / 2 + 22 ? ny : dist < W / 2 + 50 ? lerp(ny, -2, (dist - W / 2 - 22) / 28) : -2;
      spots.push([x, y, z, 0.7 + Math.random() * 0.8]);
    }
  }
  const parts = th.deco === "tree"
    ? [[new THREE.CylinderGeometry(0.5, 0.7, 3, 6), 0x8a5a33, 1.5], [new THREE.IcosahedronGeometry(2.8, 0), 0x2fa84f, 4.6], [new THREE.IcosahedronGeometry(1.8, 0), 0x52d36b, 6.6]]
    : th.deco === "pine"
      ? [[new THREE.CylinderGeometry(0.45, 0.6, 2.4, 6), 0x7a5230, 1.2], [new THREE.ConeGeometry(3, 6, 7), 0x1f7a52, 5], [new THREE.ConeGeometry(1.5, 2.4, 7), 0xffffff, 8.2]]
      : [[new THREE.DodecahedronGeometry(3.2, 0), 0xc4683a, 2.2], [new THREE.DodecahedronGeometry(2.2, 0), 0xe08a4f, 5.2]];
  for (const [geo, color, oy] of parts) {
    const im = new THREE.InstancedMesh(geo, phong(color), spots.length);
    spots.forEach(([x, y, z, s], i) => {
      m4.compose(new V3(x, y + oy * s, z), new THREE.Quaternion().setFromAxisAngle(new V3(0, 1, 0), (x * 13 + z * 7) % 6.28), new V3(s, s * (th.deco === "rock" ? 1.3 : 1), s));
      im.setMatrixAt(i, m4);
    });
    trackGroup.add(im);
  }
  // 먼 산 / 언덕 / 구름
  const cx = (minX + maxX) / 2, cz = (minZ + maxZ) / 2;
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2, r = 560 + Math.random() * 120, s = 60 + Math.random() * 80;
    const geo = th.deco === "tree" ? new THREE.SphereGeometry(s, 10, 6) : new THREE.ConeGeometry(s, s * (th.deco === "pine" ? 2.2 : 1.2), 6);
    const hm = new THREE.Mesh(geo, phong(i % 2 ? th.hill : new THREE.Color(th.hill).multiplyScalar(0.85).getHex()));
    hm.position.set(cx + Math.cos(a) * r, th.deco === "tree" ? -s * 0.45 : s * 0.4, cz + Math.sin(a) * r);
    if (th.deco === "tree") hm.scale.y = 0.6;
    trackGroup.add(hm);
  }
  const cloudM = new THREE.MeshLambertMaterial({ color: 0xffffff });
  for (let i = 0; i < 16; i++) {
    const g = new THREE.Group();
    for (let j = 0; j < 4; j++) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(8 + Math.random() * 6, 8, 6), cloudM);
      b.position.set(j * 10 - 15, Math.random() * 4, Math.random() * 6);
      g.add(b);
    }
    g.position.set(cx + (Math.random() - 0.5) * 900, 90 + Math.random() * 50, cz + (Math.random() - 0.5) * 900);
    g.scale.y = 0.55;
    trackGroup.add(g);
  }

  // 아이템 박스
  const boxGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
  const ribbonGeo = new THREE.BoxGeometry(1.86, 1.86, 0.35);
  TR.boxMat = new THREE.MeshLambertMaterial({ color: 0xff4f8b, emissive: 0x331122 });
  const ribM = phong(0xffffff);
  for (const f of [0.18, 0.43, 0.68, 0.88]) {
    const i = Math.floor(N * f), p = P[i], n = NR[i];
    for (const off of [-5.2, -1.75, 1.75, 5.2]) {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(boxGeo, TR.boxMat));
      const r1 = new THREE.Mesh(ribbonGeo, ribM); g.add(r1);
      const r2 = new THREE.Mesh(ribbonGeo, ribM); r2.rotation.y = Math.PI / 2; g.add(r2);
      const x = p.x + n.x * off, z = p.z + n.z * off;
      g.position.set(x, p.y + 1.4, z);
      trackGroup.add(g);
      TR.boxes.push({ x, z, y: p.y, idx: i, off, mesh: g, respawn: 0 });
    }
  }
  // 젬
  const gemGeo = new THREE.OctahedronGeometry(0.55, 0);
  const gemMat = new THREE.MeshLambertMaterial({ color: 0x49e4ff, emissive: 0x0b5566 });
  for (const f of [0.08, 0.3, 0.55, 0.78]) {
    const base = Math.floor(N * f), off = (Math.random() - 0.5) * W * 0.6;
    for (let j = 0; j < 5; j++) {
      const i = (base + j * 3) % N, p = P[i], n = NR[i];
      const x = p.x + n.x * off, z = p.z + n.z * off;
      const m = new THREE.Mesh(gemGeo, gemMat);
      m.position.set(x, p.y + 1.0, z);
      trackGroup.add(m);
      TR.gems.push({ x, z, mesh: m, respawn: 0 });
    }
  }
  buildMinimap();
}

function buildMinimap() {
  const c = document.createElement("canvas");
  c.width = c.height = 220;
  const g = c.getContext("2d");
  const xs = TR.P.map((p) => p.x), zs = TR.P.map((p) => p.z);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const sc = 190 / Math.max(maxX - minX, maxZ - minZ);
  const ox = 110 - ((minX + maxX) / 2) * sc, oz = 110 - ((minZ + maxZ) / 2) * sc;
  // 카메라 시점과 같은 방향이 되도록 x를 뒤집음
  const map = (x, z) => [220 - (ox + x * sc), 220 - (oz + z * sc)];
  g.lineJoin = "round";
  for (const [w, s] of [[16, "#1d1235"], [9, "#fff6e6"]]) {
    g.beginPath();
    TR.P.forEach((p, i) => { const [x, y] = map(p.x, p.z); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath();
    g.lineWidth = w; g.strokeStyle = s; g.stroke();
  }
  const [sx, sy] = map(TR.P[0].x, TR.P[0].z);
  g.fillStyle = "#ff4f8b"; g.fillRect(sx - 6, sy - 6, 12, 12);
  TR.minimap = { canvas: c, map };
}

// ═════════════ 카트 ═════════════
let K = [];
let player = null;
const hazards = [], rockets = [];

function makeKartMesh(r) {
  const g = new THREE.Group(), body = new THREE.Group();
  g.add(body);
  const M = phong(r.color), D = phong(0x2a2440), H = phong(r.helmet);
  const add = (geo, mat, x, y, z, parent = body) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; };
  add(new THREE.BoxGeometry(1.5, 0.42, 2.3), M, 0, 0.46, 0);
  add(new THREE.BoxGeometry(1.1, 0.32, 0.7), M, 0, 0.42, 1.4);
  add(new THREE.BoxGeometry(1.75, 0.22, 0.3), D, 0, 0.32, 1.78);
  add(new THREE.BoxGeometry(1.65, 0.12, 0.42), D, 0, 1.08, -1.2);
  add(new THREE.BoxGeometry(0.12, 0.5, 0.12), D, -0.6, 0.82, -1.2);
  add(new THREE.BoxGeometry(0.12, 0.5, 0.12), D, 0.6, 0.82, -1.2);
  add(new THREE.BoxGeometry(0.9, 0.62, 0.25), D, 0, 0.9, -0.62);
  add(new THREE.CylinderGeometry(0.32, 0.4, 0.6, 8), phong(0xffffff), 0, 0.98, -0.28);
  add(new THREE.SphereGeometry(0.44, 10, 8), H, 0, 1.55, -0.26);
  add(new THREE.BoxGeometry(0.56, 0.18, 0.12), D, 0, 1.55, 0.12);
  add(new THREE.BoxGeometry(0.7, 0.08, 0.08), D, 0, 1.0, 0.45);
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.36, 10);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheels = [], front = [];
  for (const [x, z] of [[-0.88, 0.85], [0.88, 0.85], [-0.88, -0.85], [0.88, -0.85]]) {
    const holder = new THREE.Group();
    holder.position.set(x, 0.4, z);
    body.add(holder);
    const w = new THREE.Mesh(wheelGeo, D);
    holder.add(w);
    wheels.push(w);
    if (z > 0) front.push(holder);
  }
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.6, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.09;
  g.add(shadow);
  const sparkMat = new THREE.MeshBasicMaterial({ color: 0x5fd0ff });
  const sparks = [-0.8, 0.8].map((x) => { const s = add(new THREE.SphereGeometry(0.22, 6, 5), sparkMat, x, 0.25, -1.25); s.visible = false; return s; });
  const flame = add(new THREE.ConeGeometry(0.32, 1.3, 8), new THREE.MeshBasicMaterial({ color: 0xff9f1c }), 0, 0.5, -1.9);
  flame.rotation.x = -Math.PI / 2;
  flame.visible = false;
  const shield = add(new THREE.SphereGeometry(2.1, 16, 12), new THREE.MeshBasicMaterial({ color: 0x7fe6ff, transparent: true, opacity: 0.28, depthWrite: false }), 0, 0.9, 0, g);
  shield.visible = false;
  scene.add(g);
  return { g, body, wheels, front, sparks, sparkMat, flame, shield };
}

function clearKarts() {
  for (const k of K) { disposeGroup(k.m.g); scene.remove(k.m.g); }
  K = [];
  for (const h of hazards) { scene.remove(h.mesh); }
  for (const r of rockets) { scene.remove(r.mesh); }
  hazards.length = 0; rockets.length = 0;
}

function spawnKarts(withPlayer) {
  clearKarts();
  const N = TR.N;
  const order = RACERS.map((_, i) => i);
  // 플레이어는 뒤쪽 그리드(6번째)에서 출발
  if (withPlayer) {
    const pi = S.sel.racer;
    order.splice(order.indexOf(pi), 1);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    order.splice(5, 0, pi);
  }
  const ai = CC[S.sel.cc].ai;
  order.forEach((ri, slot) => {
    const row = Math.floor(slot / 2), side = slot % 2 ? 1 : -1;
    const idx = (N - 5 - row * 6 - (slot % 2) * 3 + N) % N;
    const p = TR.P[idx], n = TR.NR[idx], t = TR.T[idx];
    const k = {
      id: slot, ri, racer: RACERS[ri], isPlayer: withPlayer && ri === S.sel.racer,
      m: makeKartMesh(RACERS[ri]),
      x: p.x + n.x * side * 3.4, z: p.z + n.z * side * 3.4, y: p.y, heading: Math.atan2(t.x, t.z),
      speed: 0, drift: 0, driftT: 0, boostT: 0, spinT: 0, shieldT: 0, hopT: 0, wallT: 0,
      item: null, uses: 0, rouletteT: 0, gems: 0, idx, lap: 0, checkpoint: true, prog: idx - N,
      finished: false, finishTime: 0, rank: slot + 1,
      lane: (Math.random() - 0.5) * W * 0.5, laneT: 0, aiItemT: 1 + Math.random(),
      baseSkill: lerp(ai[0], ai[1], Math.random()), skill: 1, steerVis: 0, pitch: 0, wrongT: 0,
      style: ["attack", "balanced", "balanced", "safe"][Math.floor(Math.random() * 4)], plan: "balanced",
      st: { speed: RACERS[ri].speed, accel: RACERS[ri].accel, handling: RACERS[ri].handling, off: 0.5 }, lastRank: slot + 1, mistakes: 0,
    };
    if (k.isPlayer) {
      const e = ENGINES[S.sel.engine], t = TIRES[S.sel.tire];
      k.baseSkill = lerp(ai[0], ai[1], 0.75);
      k.st = { speed: k.racer.speed + e.sp + t.sp, accel: k.racer.accel + e.ac + t.ac, handling: k.racer.handling + e.hd + t.hd, off: 0.5 + e.off + t.off };
    }
    k.prog = k.lap * N + k.idx - N;
    K.push(k);
    if (k.isPlayer) player = k;
  });
  if (!withPlayer) player = null;
  S.ccMax = CC[S.sel.cc].max;
}

function nearestIdx(x, z, start, win) {
  const N = TR.N, P = TR.P;
  let best = start, bd = Infinity;
  for (let o = -win; o <= win; o++) {
    const i = (start + o + N) % N, p = P[i];
    const d = (p.x - x) ** 2 + (p.z - z) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
const latOf = (x, z, i) => (x - TR.P[i].x) * TR.NR[i].x + (z - TR.P[i].z) * TR.NR[i].z;

// ═════════════ 아이템 ═════════════
function rollItem(rank) {
  const tables = rank <= 2
    ? { oil: 45, shield: 30, nitro: 25 }
    : rank <= 5
      ? { nitro: 32, oil: 22, rocket: 28, shield: 12, triple: 6 }
      : { nitro: 25, triple: 25, rocket: 35, shield: 15 };
  let r = Math.random() * 100;
  for (const [k, w] of Object.entries(tables)) { r -= w; if (r < 0) return k; }
  return "nitro";
}
function assignItem(k) {
  k.item = rollItem(k.rank);
  k.uses = k.item === "triple" ? 3 : 1;
  if (k.isPlayer) { sfx(660, 990, 0.12, "triangle", 0.12); updateItemSlot(); radio(`아이템 획득: ${ITEM_NAME[k.item]}`, "item"); }
}
function useItem(k) {
  if (!k.item || k.rouletteT > 0 || k.spinT > 0) return;
  const it = k.item;
  if (k.isPlayer) { radio(`${S.autoFired ? "자동 사용" : "지시대로 사용"}: ${ITEM_NAME[it]}${k.item === "triple" && k.uses > 1 ? ` (남은 ${k.uses - 1})` : ""}`, "item"); S.autoFired = false; }
  const fx = Math.sin(k.heading), fz = Math.cos(k.heading);
  if (it === "nitro" || it === "triple") {
    k.boostT = Math.max(k.boostT, 1.3);
    k.speed += 6;
    if (k.isPlayer) sfx(200, 700, 0.35, "sawtooth", 0.12);
  } else if (it === "oil") {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.7, 0.08, 14), new THREE.MeshPhongMaterial({ color: 0x15121f, shininess: 120, specular: 0x8888ff }));
    const x = k.x - fx * 3.2, z = k.z - fz * 3.2;
    m.position.set(x, k.y + 0.12, z);
    scene.add(m);
    hazards.push({ x, z, mesh: m, owner: k, t: 0 });
    if (hazards.length > 14) { const h = hazards.shift(); scene.remove(h.mesh); h.mesh.geometry.dispose(); }
    if (k.isPlayer) sfx(300, 120, 0.2, "square", 0.08);
  } else if (it === "rocket") {
    const ahead = K.filter((o) => o !== k && !o.finished && o.prog > k.prog).sort((a, b) => a.prog - b.prog)[0] || null;
    const g = new THREE.Group();
    const bodyM = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 1.6, 8), phong(0xff3b4e));
    bodyM.rotation.x = Math.PI / 2; g.add(bodyM);
    const nose = new THREE.Mesh(new THREE.ConeGeometry(0.32, 0.7, 8), phong(0xffffff));
    nose.rotation.x = Math.PI / 2; nose.position.z = 1.1; g.add(nose);
    const fire = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.9, 8), new THREE.MeshBasicMaterial({ color: 0xffd23f }));
    fire.rotation.x = -Math.PI / 2; fire.position.z = -1.2; g.add(fire);
    scene.add(g);
    rockets.push({ mesh: g, owner: k, target: ahead, prog: k.prog + 2, lat: latOf(k.x, k.z, k.idx), t: 0 });
    if (k.isPlayer) sfx(500, 1400, 0.3, "sawtooth", 0.1);
  } else if (it === "shield") {
    k.shieldT = 7;
    if (k.isPlayer) sfx(400, 800, 0.25, "sine", 0.15);
  }
  k.uses--;
  if (k.uses <= 0) k.item = null;
  if (k.isPlayer) updateItemSlot();
}
function hitKart(k, by) {
  if (k.shieldT > 0) { if (k.isPlayer) radio("방패가 공격을 막아냈다!", "good"); if (by && by.isPlayer) radio(`${k.racer.name}의 방패에 막혔다`, "info"); k.shieldT = 0; if (k.isPlayer) sfx(900, 300, 0.2, "triangle", 0.12); return false; }
  if (k.spinT > 0) return false;
  k.spinT = 1.15;
  k.speed *= 0.35;
  k.drift = 0; k.driftT = 0; k.boostT = 0;
  k.gems = Math.max(0, k.gems - 2);
  if (k.isPlayer) { sfx(400, 80, 0.45, "square", 0.15); vibrate(80); radio(by ? `${by.racer.name}의 공격에 맞았다!` : "미끄러졌다!", "bad"); }
  else if (by && by.isPlayer) radio(`명중! ${k.racer.name} 스핀`, "good");
  return true;
}

// ═════════════ 물리 ═════════════
function releaseDrift(k) {
  const lvl = k.driftT > 3 ? 3 : k.driftT > 2 ? 2 : k.driftT > 1 ? 1 : 0;
  if (lvl) {
    k.boostT = Math.max(k.boostT, [0, 0.6, 1.0, 1.5][lvl]);
    k.speed += [0, 3, 5, 7][lvl];
    if (k.isPlayer) { sfx(250 + lvl * 120, 900 + lvl * 200, 0.3, "sawtooth", 0.1); if (lvl >= 2) radio(`${["", "", "주황", "보라"][lvl]} 드리프트 부스트!`, "good"); }
  }
  k.drift = 0; k.driftT = 0;
}

function updateKart(k, dt, c) {
  const r = k.st, N = TR.N;
  k.boostT = Math.max(0, k.boostT - dt);
  k.shieldT = Math.max(0, k.shieldT - dt);
  k.hopT = Math.max(0, k.hopT - dt);
  k.wallT = Math.max(0, k.wallT - dt);
  if (k.rouletteT > 0) { k.rouletteT -= dt; if (k.rouletteT <= 0) assignItem(k); }

  const lat0 = latOf(k.x, k.z, k.idx);
  const off = Math.abs(lat0) > W / 2 + 1.4;
  let max = S.ccMax * r.speed * (1 + k.gems * 0.006) * k.skill;
  if (k.boostT > 0) max *= 1.38;
  if (off) max *= k.boostT > 0 ? 0.82 : r.off;

  if (k.spinT > 0) {
    k.spinT -= dt;
    k.speed *= Math.exp(-2.5 * dt);
  } else {
    if (c.brake) k.speed = Math.max(-8, k.speed - 32 * dt);
    else if (c.gas) {
      if (k.speed < max) k.speed = Math.min(max, k.speed + r.accel * 22 * dt * (1.15 - Math.max(0, k.speed) / max));
      else k.speed = Math.max(max, k.speed - 16 * dt);
    } else {
      k.speed *= Math.exp(-0.8 * dt);
      if (k.speed > max) k.speed = Math.max(max, k.speed - 16 * dt);
    }
    const s = c.steer;
    if (c.drift && !k.drift && Math.abs(s) > 0.25 && k.speed > 11) { k.drift = Math.sign(s); k.driftT = 0; k.hopT = 0.25; }
    if (k.drift && (!c.drift || k.speed < 7)) releaseDrift(k);
    if (k.drift) {
      const d = k.drift;
      k.heading -= d * (1.0 + 0.8 * s * d) * r.handling * dt;
      k.driftT += dt * (0.75 + 0.55 * Math.max(0, s * d));
      k.speed -= 1.5 * dt;
    } else {
      const sf = clamp(Math.abs(k.speed) / 8, 0, 1) * (1 - 0.28 * clamp(k.speed / S.ccMax, 0, 1));
      k.heading -= s * 1.95 * r.handling * sf * dt * (k.speed < 0 ? -1 : 1);
    }
    if (c.item) useItem(k);
  }
  k.steerVis = lerp(k.steerVis, k.spinT > 0 ? 0 : c.steer, Math.min(1, dt * 10));

  const fx = Math.sin(k.heading), fz = Math.cos(k.heading);
  k.x += fx * k.speed * dt;
  k.z += fz * k.speed * dt;

  const prev = k.idx;
  k.idx = nearestIdx(k.x, k.z, k.idx, 18);
  const dIdx = k.idx - prev;
  if (dIdx < -N / 2) { if (k.checkpoint) { k.lap++; k.checkpoint = false; onLap(k); } }
  else if (dIdx > N / 2) { k.lap--; k.checkpoint = true; }
  if (k.idx > N * 0.4 && k.idx < N * 0.6) k.checkpoint = true;
  k.prog = (k.lap - 1) * N + k.idx;

  const lat = latOf(k.x, k.z, k.idx);
  if (Math.abs(lat) > WALL) {
    const ex = Math.abs(lat) - WALL, sg = Math.sign(lat), n = TR.NR[k.idx], t = TR.T[k.idx];
    k.x -= n.x * sg * ex; k.z -= n.z * sg * ex;
    if (k.wallT <= 0) { k.speed *= 0.72; k.wallT = 0.4; if (k.isPlayer) { sfx(140, 60, 0.15, "square", 0.12); vibrate(30); } }
    k.heading += wrap(Math.atan2(t.x, t.z) - k.heading) * Math.min(1, dt * 6);
  }
  const p = TR.P[k.idx], pn = TR.P[(k.idx + 2) % N];
  k.y = lerp(k.y, p.y, Math.min(1, dt * 12));
  k.pitch = lerp(k.pitch, -Math.atan2(pn.y - p.y, 4), Math.min(1, dt * 6));

  // 역주행 감지
  const t = TR.T[k.idx];
  if (k.isPlayer) {
    if (fx * t.x + fz * t.z < -0.3 && k.speed > 3) k.wrongT += dt; else k.wrongT = 0;
  }
}

function onLap(k) {
  if (k.lap > LAPS && !k.finished) {
    k.finished = true;
    k.finishTime = S.raceTime;
    if (k.isPlayer) playerFinished();
    return;
  }
  if (k.isPlayer && k.lap >= 2) {
    showBanner(k.lap === LAPS ? "마지막 랩!" : `LAP ${k.lap}`, true);
    radio(`${k.lap}랩 진입 · 현재 ${k.rank}위`, "info");
    sfx(523, 784, 0.25, "triangle", 0.15);
  }
}

// ═════════════ AI ═════════════
function aiControl(k, dt) {
  const N = TR.N;
  const style = k.isPlayer ? S.sel.style : k.style;
  const plan = k.isPlayer ? S.sel.plan : k.plan;
  const ST = STYLES[style];
  // 뒤처진 차만 조금 따라잡는 보정 (모든 차에 동일하게 적용)
  const leaderProg = Math.max(...K.map((o) => o.prog));
  k.skill = k.baseSkill * ST.mul * (1 + clamp(((leaderProg - k.prog) / N) * 0.08, 0, 0.04));

  k.laneT -= dt;
  if (k.laneT <= 0) { k.laneT = 2 + Math.random() * 3; k.lane = (Math.random() - 0.5) * W * 0.6; }
  let lane = k.lane;
  if (!k.item && k.rouletteT <= 0) {
    for (const b of TR.boxes) {
      const ahead = (b.idx - k.idx + N) % N;
      if (b.respawn <= 0 && ahead > 4 && ahead < 30) { if (Math.abs(b.off - lane) < 4) { lane = b.off; break; } }
    }
  }
  const look = 7 + Math.floor(Math.max(0, k.speed) * 0.2);
  const ti = (k.idx + look) % N, p = TR.P[ti], n = TR.NR[ti];
  const desired = Math.atan2(p.x + n.x * lane - k.x, p.z + n.z * lane - k.z);
  const diff = wrap(desired - k.heading);
  let steer = clamp(-diff * 2.4, -1, 1);
  const tA = TR.T[k.idx], tB = TR.T[(k.idx + 18) % N];
  const curve = wrap(Math.atan2(tB.x, tB.z) - Math.atan2(tA.x, tA.z));
  let drift = false;
  if (k.drift) {
    drift = Math.abs(curve) > 0.12 || k.driftT < 0.5;
    if (Math.sign(-diff) !== k.drift && Math.abs(diff) > 0.35) drift = false;
  } else if (Math.abs(curve) > ST.driftAt && k.speed > 14 && Math.random() < dt * ST.driftRate) {
    drift = true;
    steer = curve > 0 ? -1 : 1;
  }
  // 무리한 드리프트는 실수로 이어질 수 있음
  if (k.drift && k.spinT <= 0 && S.state !== "attract" && Math.random() < dt * ST.mistake * (1 + Math.abs(curve))) {
    k.spinT = 0.6; k.speed *= 0.6; k.drift = 0; k.driftT = 0; k.mistakes++;
    if (k.isPlayer) radio(`${k.racer.name}: 코스 이탈! 무리했어요`, "bad");
  }

  let item = false;
  k.aiItemT -= dt;
  if (k.item && k.rouletteT <= 0) k.holdT = (k.holdT || 0) + dt; else k.holdT = 0;
  const autoOn = !k.isPlayer || S.sel.autoItem;
  if (autoOn && k.item && k.rouletteT <= 0 && k.aiItemT <= 0 && k.spinT <= 0) {
    k.aiItemT = 0.25;
    const it = k.item;
    const behind = (d) => K.some((o) => o !== k && k.prog - o.prog > 1 && k.prog - o.prog < d);
    const ahead = (d) => K.some((o) => o !== k && !o.finished && o.prog > k.prog && o.prog - k.prog < d);
    const straight = Math.abs(curve) < 0.3;
    const slowed = k.speed < S.ccMax * 0.6;
    const incoming = rockets.some((r) => r.target === k);
    const left = LAPS * N - k.prog;               // 남은 거리(샘플)
    const endgame = left < N * 0.3;                // 마지막 랩 후반: 남은 아이템은 모두 소진
    const isBoost = it === "nitro" || it === "triple";
    const boostReady = isBoost && k.boostT < 0.15 && (straight || slowed);
    if (endgame && (!isBoost || boostReady)) item = true;
    else if (it === "shield" && incoming) item = true;
    else if (plan === "attack") {
      if (boostReady) item = true;
      else if (it === "rocket" && ahead(250)) item = true;
      else if (it === "oil" && (behind(30) || k.holdT > 4)) item = true;
      else if (it === "shield" && (behind(8) || k.holdT > 5)) item = true;
    } else if (plan === "defend") {
      if (boostReady && (k.lap >= LAPS || k.rank > 4 || slowed)) item = true;
      else if (it === "rocket" && ahead(40)) item = true;
      else if (it === "oil" && behind(6)) item = true;
    } else {
      if (boostReady) item = true;
      else if (it === "rocket" && (ahead(120) || k.holdT > 6)) item = true;
      else if (it === "oil" && (behind(14) || k.holdT > 6)) item = true;
      else if (it === "shield" && (behind(10) || k.holdT > 7)) item = true;
    }
    if (item && k.isPlayer) S.autoFired = true;
  }
  if (k.isPlayer && S.manualItem) { S.manualItem = false; if (k.item && k.rouletteT <= 0) item = true; }
  return { steer, gas: true, brake: false, drift, item };
}

// ═════════════ 감독 지시 ═════════════
function setStyle(v) { if (S.sel.style === v) return; S.sel.style = v; saveSel(); syncPanel(); if (player && S.state !== "attract") radio(`지시: ${STYLES[v].name} 주행`, "info"); }
function setPlan(v) { if (S.sel.plan === v) return; S.sel.plan = v; saveSel(); syncPanel(); if (player && S.state !== "attract") radio(`지시: 아이템 ${PLANS[v]} 운용`, "info"); }
const CAMS = ["chase", "tv", "leader"], CAM_NAME = { chase: "추적", tv: "중계", leader: "선두" };
function cycleCam() { S.sel.cam = CAMS[(CAMS.indexOf(S.sel.cam) + 1) % CAMS.length]; saveSel(); camSnap = true; syncPanel(); }
function cycleSpeed() { S.sel.speed = S.sel.speed >= 3 ? 1 : S.sel.speed + 1; saveSel(); syncPanel(); }
function useNow() { if (player && player.item && player.rouletteT <= 0 && S.state === "race") S.manualItem = true; }
function syncPanel() {
  document.querySelectorAll("#segStyle button").forEach((b) => b.className = b.dataset.s === S.sel.style ? "on " + b.dataset.s : "");
  document.querySelectorAll("#segPlan button").forEach((b) => b.className = b.dataset.p === S.sel.plan ? "on" : "");
  $("camBtn").textContent = CAM_NAME[S.sel.cam] + " 캠";
  $("spdBtn").textContent = "×" + S.sel.speed;
  const ab = $("autoBtn");
  ab.textContent = S.sel.autoItem ? "자동 켜짐" : "자동 꺼짐";
  ab.classList.toggle("off", !S.sel.autoItem);
  ab.setAttribute("aria-pressed", String(S.sel.autoItem));
  $("useItem").disabled = !(player && player.item && player.rouletteT <= 0);
}
$("segStyle").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setStyle(b.dataset.s); });
$("segPlan").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setPlan(b.dataset.p); });
$("camBtn").addEventListener("click", cycleCam);
$("spdBtn").addEventListener("click", cycleSpeed);
$("useItem").addEventListener("click", useNow);
function toggleAuto() {
  S.sel.autoItem = !S.sel.autoItem; saveSel(); syncPanel();
  if (player && S.state !== "attract") radio(S.sel.autoItem ? "아이템 자동 사용: 켜짐 (전략에 맞춰 알아서 사용)" : "아이템 자동 사용: 꺼짐 (지금 사용 버튼으로만)", "info");
}
$("autoBtn").addEventListener("click", toggleAuto);
$("pauseBtn").addEventListener("click", togglePause);
window.addEventListener("keydown", (e) => {
  if (!(S.state === "race" || S.state === "countdown" || S.state === "finish")) return;
  const k = e.key.toLowerCase();
  if (k === "escape" || k === "p") togglePause();
  if (S.paused) return;
  if (k === "1") setStyle("attack"); else if (k === "2") setStyle("balanced"); else if (k === "3") setStyle("safe");
  else if (k === "q") setPlan("attack"); else if (k === "w") setPlan("balanced"); else if (k === "e") setPlan("defend");
  else if (k === " ") { e.preventDefault(); useNow(); }
  else if (k === "c") cycleCam(); else if (k === "f") cycleSpeed(); else if (k === "a") toggleAuto();
});

// 팀 무전 피드
let feedItems = [];
function radio(msg, kind) {
  const el = document.createElement("div");
  el.className = kind || "info";
  el.textContent = msg;
  const f = $("feed");
  f.appendChild(el);
  feedItems.push({ el, t: 5 });
  while (feedItems.length > 4) feedItems.shift().el.remove();
}
function tickFeed(dt) {
  for (let i = feedItems.length - 1; i >= 0; i--) {
    const it = feedItems[i];
    it.t -= dt;
    if (it.t < 0.6) it.el.style.opacity = Math.max(0, it.t / 0.6);
    if (it.t <= 0) { it.el.remove(); feedItems.splice(i, 1); }
  }
}
function placeFeed() {
  const p = $("panel");
  if (p && !$("hud").hidden) {
    $("feed").style.bottom = (p.offsetHeight + 22) + "px";
    // 하단 패널에 내 카트가 가리지 않도록 화면을 위로 올림
    camera.setViewOffset(window.innerWidth, window.innerHeight, 0, Math.round((p.offsetHeight + 10) * 0.5), window.innerWidth, window.innerHeight);
  } else camera.clearViewOffset();
}
window.addEventListener("resize", placeFeed);
const vibrate = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* 미지원 */ } };

// ═════════════ 사운드 ═════════════
let AC = null, master = null, engOsc = null, engGain = null;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = S.sel.sound ? 0.5 : 0;
    master.connect(AC.destination);
    engOsc = AC.createOscillator();
    engOsc.type = "sawtooth";
    const lp = AC.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 520;
    engGain = AC.createGain();
    engGain.gain.value = 0;
    engOsc.connect(lp); lp.connect(engGain); engGain.connect(master);
    engOsc.start();
  } catch (e) { AC = null; }
}
function sfx(f1, f2, dur, type, vol) {
  if (!AC || !S.sel.sound) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function setSound(on) {
  S.sel.sound = on; saveSel();
  if (master) master.gain.value = on ? 0.5 : 0;
}

const ICONS = {
  nitro: '<svg viewBox="0 0 64 64"><path d="M32 4c6 9 12 12 12 22a12 12 0 0 1-24 0c0-6 4-9 5-15 3 5 5 6 7 6-2-6-2-9 0-13z" fill="#ff9f1c" stroke="#1d1235" stroke-width="3"/><rect x="18" y="34" width="28" height="26" rx="6" fill="#ff4f8b" stroke="#1d1235" stroke-width="3"/><path d="M24 44h16M24 51h16" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>',
  oil: '<svg viewBox="0 0 64 64"><path d="M10 40c0-8 10-12 22-12s22 4 22 12-10 14-22 14-22-6-22-14z" fill="#1d1235"/><ellipse cx="24" cy="36" rx="7" ry="3" fill="#8f8cff"/><path d="M32 8c5 8 8 11 8 16a8 8 0 0 1-16 0c0-5 3-8 8-16z" fill="#1d1235"/></svg>',
  rocket: '<svg viewBox="0 0 64 64"><path d="M32 4c9 8 12 18 12 30v12H20V34c0-12 3-22 12-30z" fill="#ff3b4e" stroke="#1d1235" stroke-width="3"/><circle cx="32" cy="26" r="6" fill="#fff" stroke="#1d1235" stroke-width="3"/><path d="M20 38l-8 12h8zM44 38l8 12h-8z" fill="#ffd23f" stroke="#1d1235" stroke-width="3"/><path d="M26 48h12l-6 12z" fill="#ff9f1c"/></svg>',
  shield: '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="25" fill="#7fe6ff" stroke="#1d1235" stroke-width="3"/><path d="M20 24a14 14 0 0 1 12-9" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>',
};
ICONS.triple = ICONS.nitro.replace("</svg>", '<circle cx="50" cy="14" r="11" fill="#fff" stroke="#1d1235" stroke-width="3"/><text x="50" y="19" text-anchor="middle" font-size="14" font-family="Jua, sans-serif" fill="#1d1235">×3</text></svg>');
function updateItemSlot() {
  if (!player) return;
  const el = $("itemslot");
  if (player.rouletteT > 0) return;
  if (!player.item) { el.innerHTML = ""; el.title = ""; return; }
  let svg = ICONS[player.item];
  if (player.item === "triple") svg = ICONS.triple.replace("×3", "×" + player.uses);
  el.innerHTML = svg;
  el.title = ITEM_NAME[player.item];
}
let lastHud = {};
function updateHud() {
  if (!player) return;
  const set = (id, v) => { if (lastHud[id] !== v) { lastHud[id] = v; $(id).innerHTML = v; } };
  set("lap", String(clamp(player.lap, 1, LAPS)));
  const t = player.finished ? player.finishTime : S.raceTime;
  set("time", fmtTime(t));
  const colors = ["#ffd23f", "#e6edf5", "#ffb27a"];
  const pe = $("pos");
  if (lastHud.rank !== player.rank) { lastHud.rank = player.rank; pe.innerHTML = `${player.rank}<sup>위</sup>`; pe.style.color = colors[player.rank - 1] || "#fff6e6"; }
  set("gemn", String(player.gems));
  set("who", `${player.racer.name} · ${Math.round(Math.max(0, player.speed) * 3.6)}km/h`);
  const canUse = !!(player.item && player.rouletteT <= 0 && S.state === "race");
  if (lastHud.canUse !== canUse) { lastHud.canUse = canUse; $("useItem").disabled = !canUse; }
  if (player.rouletteT > 0) {
    const keys = Object.keys(ICONS).filter((k) => k !== "triple");
    $("itemslot").innerHTML = ICONS[keys[Math.floor(performance.now() / 90) % keys.length]];
  }
  drawMinimap();
}
function drawMinimap() {
  const c = $("map"), g = c.getContext("2d");
  g.clearRect(0, 0, 220, 220);
  g.drawImage(TR.minimap.canvas, 0, 0);
  for (const k of [...K].sort((a, b) => (a.isPlayer ? 1 : 0) - (b.isPlayer ? 1 : 0))) {
    const [x, y] = TR.minimap.map(k.x, k.z);
    g.beginPath();
    g.arc(x, y, k.isPlayer ? 10 : 7, 0, Math.PI * 2);
    g.fillStyle = "#" + k.racer.color.toString(16).padStart(6, "0");
    g.fill();
    g.lineWidth = k.isPlayer ? 4 : 2.5;
    g.strokeStyle = k.isPlayer ? "#fff" : "#1d1235";
    g.stroke();
  }
}

// ═════════════ 메인 루프 ═════════════
let camSnap = true, last = performance.now(), boxHue = 0;
const camPos = new V3(), camLook = new V3();

function step(dt) {
  const racing = S.state === "race" || S.state === "finish";
  if (S.state === "countdown") {
    const before = Math.ceil(S.countdown - 0.6);
    S.countdown -= dt;
    const after = Math.ceil(S.countdown - 0.6);
    if (after !== before && after >= 1 && after <= 3) { showBanner(String(after)); sfx(440, 440, 0.18, "square", 0.12); }
    if (S.countdown <= 0.6) { S.state = "race"; showBanner("GO!"); sfx(880, 880, 0.4, "square", 0.14); }
  }
  if (racing || S.state === "attract") {
    if (racing) S.raceTime += dt;
    for (const k of K) updateKart(k, dt, aiControl(k, dt));
    // 카트 간 충돌
    for (let i = 0; i < K.length; i++) for (let j = i + 1; j < K.length; j++) {
      const a = K[i], b = K[j];
      const dx = b.x - a.x, dz = b.z - a.z, d2 = dx * dx + dz * dz;
      if (d2 < 4.4 && d2 > 0.0001 && Math.abs(a.y - b.y) < 2) {
        const d = Math.sqrt(d2), push = (2.1 - d) / 2, nx = dx / d, nz = dz / d;
        a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
        if (a.shieldT > 0 && b.shieldT <= 0) hitKart(b, a);
        else if (b.shieldT > 0 && a.shieldT <= 0) hitKart(a, b);
        else { const avg = (a.speed + b.speed) / 2; a.speed = lerp(a.speed, avg, 0.2); b.speed = lerp(b.speed, avg, 0.2); }
        if ((a.isPlayer || b.isPlayer)) vibrate(15);
      }
    }
    // 아이템 박스, 젬
    boxHue = (boxHue + dt * 0.25) % 1;
    TR.boxMat.color.setHSL(boxHue, 0.85, 0.6);
    for (const b of TR.boxes) {
      if (b.respawn > 0) { b.respawn -= dt; b.mesh.visible = b.respawn <= 0; if (b.respawn <= 0) b.mesh.scale.setScalar(1); continue; }
      b.mesh.rotation.y += dt * 1.6;
      b.mesh.rotation.x = Math.sin(performance.now() / 600 + b.off) * 0.3;
      for (const k of K) {
        if ((k.x - b.x) ** 2 + (k.z - b.z) ** 2 < 5.2) {
          b.respawn = 2.5; b.mesh.visible = false;
          if (!k.item && k.rouletteT <= 0) { k.rouletteT = 1.1; if (k.isPlayer) sfx(700, 500, 0.08, "square", 0.08); }
          break;
        }
      }
    }
    for (const g of TR.gems) {
      if (g.respawn > 0) { g.respawn -= dt; g.mesh.visible = g.respawn <= 0; continue; }
      g.mesh.rotation.y += dt * 3;
      for (const k of K) {
        if ((k.x - g.x) ** 2 + (k.z - g.z) ** 2 < 3.2) {
          g.respawn = 8; g.mesh.visible = false;
          if (k.gems < 10) k.gems++;
          if (k.isPlayer) sfx(1200, 1800, 0.08, "triangle", 0.1);
          break;
        }
      }
    }
    // 오일
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      h.t += dt;
      for (const k of K) {
        if (k === h.owner && h.t < 1) continue;
        if ((k.x - h.x) ** 2 + (k.z - h.z) ** 2 < 3.2) {
          hitKart(k, h.owner === k ? null : h.owner);
          scene.remove(h.mesh); h.mesh.geometry.dispose();
          hazards.splice(i, 1);
          break;
        }
      }
    }
    // 로켓
    const N = TR.N;
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.t += dt;
      r.prog += 31 * dt;
      let tLat = r.lat;
      if (r.target) {
        if (r.target.finished) r.target = null;
        else tLat = latOf(r.target.x, r.target.z, r.target.idx);
      }
      r.lat = lerp(r.lat, clamp(tLat, -WALL, WALL), Math.min(1, dt * 4));
      const fi = ((Math.floor(r.prog) % N) + N) % N, p = TR.P[fi], n = TR.NR[fi], t = TR.T[fi];
      const x = p.x + n.x * r.lat, z = p.z + n.z * r.lat;
      r.mesh.position.set(x, p.y + 1.3, z);
      r.mesh.rotation.y = Math.atan2(t.x, t.z);
      let done = r.t > 7;
      for (const k of K) {
        if (k === r.owner || done) continue;
        if ((k.x - x) ** 2 + (k.z - z) ** 2 < 5.5) { hitKart(k, r.owner); done = true; }
      }
      if (r.target && !done && r.prog > r.target.prog + 3) r.target = null;
      if (done) { scene.remove(r.mesh); disposeGroup(r.mesh); rockets.splice(i, 1); }
    }
    // 순위
    const order = [...K].sort((a, b) => (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : b.prog - a.prog);
    order.forEach((k, i) => (k.rank = i + 1));
    if (player && S.state === "race") {
      player.rankT = (player.rankT || 0) - dt;
      if (player.rank !== player.lastRank && player.rankT <= 0) {
        const up = player.rank < player.lastRank;
        const other = order[up ? player.rank : player.rank - 2];
        radio(up ? `추월 성공! ${other ? other.racer.name + " 제치고 " : ""}${player.rank}위` : `${other ? other.racer.name + "에게 " : ""}추월당함 · ${player.rank}위`, up ? "good" : "bad");
        player.lastRank = player.rank; player.rankT = 1.2;
      }
    }
  }

  // 카트 메시
  const now = performance.now();
  for (const k of K) {
    const m = k.m;
    m.g.position.set(k.x, k.y, k.z);
    m.g.rotation.y = k.heading;
    m.body.rotation.y = k.spinT > 0 ? m.body.rotation.y + dt * 14 : lerp(m.body.rotation.y, -k.drift * 0.38, Math.min(1, dt * 8));
    m.body.rotation.x = k.pitch;
    m.body.rotation.z = lerp(m.body.rotation.z, k.drift * 0.08 + k.steerVis * 0.04, Math.min(1, dt * 8));
    m.body.position.y = k.hopT > 0 ? Math.sin((1 - k.hopT / 0.25) * Math.PI) * 0.45 : 0;
    for (const w of m.wheels) w.rotation.x += k.speed * dt / 0.4;
    for (const f of m.front) f.rotation.y = -k.steerVis * 0.4;
    const lvl = k.driftT > 3 ? 3 : k.driftT > 2 ? 2 : k.driftT > 1 ? 1 : 0;
    const showSpark = k.drift !== 0 && lvl > 0;
    m.sparks.forEach((s) => { s.visible = showSpark; s.scale.setScalar(0.7 + Math.random() * 0.8); });
    if (showSpark) m.sparkMat.color.setHex([0, 0x3fa9ff, 0xff9f1c, 0xb36bff][lvl]);
    m.flame.visible = k.boostT > 0;
    if (m.flame.visible) m.flame.scale.set(1, 0.8 + Math.random() * 0.6, 1);
    m.shield.visible = k.shieldT > 0;
    if (m.shield.visible) m.shield.material.opacity = 0.2 + Math.sin(now / 120) * 0.08;
  }

  updateCamera(dt);
  if (player && S.state !== "attract") updateHud();

  if (engGain) {
    const on = player && (S.state === "race" || S.state === "countdown" || S.state === "finish") && !S.paused && S.sel.sound;
    engGain.gain.value = on ? 0.035 : 0;
    if (on) engOsc.frequency.value = 55 + Math.max(0, player.speed) * 3.2 + (player.boostT > 0 ? 25 : 0);
  }

  if (S.state === "finish") {
    S.finishT -= dt;
    if (S.finishT <= 0) { S.state = "results"; viewResults(); if (engGain) engGain.gain.value = 0; }
  }
}

function updateCamera(dt) {
  let target = player;
  if (S.state === "attract") {
    target = [...K].sort((a, b) => a.rank - b.rank)[0];
    const a = performance.now() / 9000;
    const want = new V3(target.x + Math.cos(a) * 26, target.y + 14, target.z + Math.sin(a) * 26);
    camPos.lerp(want, camSnap ? 1 : Math.min(1, dt * 1.5));
    camLook.lerp(new V3(target.x, target.y + 1, target.z), camSnap ? 1 : Math.min(1, dt * 4));
    camSnap = false;
    camera.position.copy(camPos);
    camera.lookAt(camLook);
    camera.fov = baseFov;
    camera.updateProjectionMatrix();
    return;
  }
  if (!target) return;
  if (S.sel.cam === "leader") target = [...K].sort((a, b) => a.rank - b.rank)[0];
  if (S.sel.cam === "tv") {
    const tt = TR.T[target.idx], nn = TR.NR[target.idx];
    const want = new V3(target.x + nn.x * 16 - tt.x * 10, target.y + 9, target.z + nn.z * 16 - tt.z * 10);
    camPos.lerp(want, camSnap ? 1 : 1 - Math.exp(-dt * 2.5));
    camLook.lerp(new V3(target.x, target.y + 1, target.z), camSnap ? 1 : 1 - Math.exp(-dt * 8));
    camSnap = false;
    camera.position.copy(camPos); camera.lookAt(camLook);
    camera.fov = lerp(camera.fov, baseFov - 6, Math.min(1, dt * 4)); camera.updateProjectionMatrix();
    return;
  }
  const fx = Math.sin(target.heading), fz = Math.cos(target.heading);
  const back = 7.2, up = 3.3;
  const want = new V3(target.x - fx * back, target.y + up, target.z - fz * back);
  const look = new V3(target.x + fx * 5, target.y + 1.2, target.z + fz * 5);
  const k = camSnap ? 1 : 1 - Math.exp(-dt * 7);
  camPos.lerp(want, k);
  camLook.lerp(look, camSnap ? 1 : 1 - Math.exp(-dt * 10));
  camSnap = false;
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  const fov = baseFov + (target.boostT > 0 ? 10 : 0) + clamp(target.speed / S.ccMax, 0, 1.4) * 4;
  camera.fov = lerp(camera.fov, fov, Math.min(1, dt * 4));
  camera.updateProjectionMatrix();
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!S.paused && S.state !== "results") {
    const n = S.state === "attract" ? 1 : S.sel.speed;
    for (let i = 0; i < n; i++) step(dt);
    tickFeed(dt);
  }
  else if (S.state === "results") updateCamera(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ═════════════ 시작 ═════════════
function boot(data) {
  if (data && data.sel) Object.assign(S.sel, data.sel);
  startAttract();
  viewTitle();
  requestAnimationFrame((t) => { last = t; loop(t); });
}
window.claude?.hot?.snapshot?.(() => ({ sel: S.sel }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
