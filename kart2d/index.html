<title>꼬마 카트 랠리</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: full-screen 3D canvas; chunky toy-box HUD floats on top (lap/time top-left, item slot top-center, position + minimap top-right, touch pads bottom). Single bright look by design. */
:root {
  color-scheme: dark;
  --ink: #1d1235;
  --cream: #fff6e6;
  --sun: #ffd23f;
  --berry: #ff4f8b;
  --sky: #3fa9ff;
  --leaf: #38c172;
  --grape: #8f5bff;
  --font: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--ink); }
body {
  font-family: var(--font); color: var(--cream);
  -webkit-user-select: none; user-select: none; touch-action: none; overscroll-behavior: none; -webkit-touch-callout: none;
}
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.stroke { -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; }

/* ── toy UI ── */
.tbtn {
  background: var(--sun); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 5px 0 var(--ink); padding: 12px 22px; font-size: 20px; line-height: 1.1; transition: transform .06s, box-shadow .06s;
}
.tbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.tbtn.alt { background: var(--cream); }
.tbtn.pink { background: var(--berry); color: #fff; }
.tbtn.blue { background: var(--sky); color: #fff; }
.card {
  background: var(--cream); color: var(--ink); border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 8px 0 var(--ink); padding: 20px; width: min(760px, 100%);
}
#ui {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; overflow-y: auto; touch-action: pan-y;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
#ui.dim { background: rgba(29, 18, 53, .55); }
.title { display: grid; justify-items: center; gap: 18px; text-align: center; }
.logo { font-size: clamp(54px, 13vw, 120px); line-height: .95; color: var(--sun); margin: 0; transform: rotate(-3deg); }
.logo span { display: block; color: var(--berry); font-size: .62em; transform: rotate(4deg); margin-bottom: .12em; }
.logo .stroke { -webkit-text-stroke: 10px var(--ink); }
.tagline { margin: 0; font-size: 17px; color: #fff; max-width: 30ch; background: rgba(29, 18, 53, .62); padding: 10px 16px; border-radius: 16px; line-height: 1.45; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
h2 { margin: 0 0 10px; font-size: 26px; font-weight: 400; }
h3 { margin: 14px 0 8px; font-size: 18px; font-weight: 400; color: #5a4c78; }
.racers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.racer {
  background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 8px 6px 10px; display: grid; justify-items: center; gap: 4px;
  box-shadow: 0 4px 0 var(--ink); color: var(--ink);
}
.racer.on { background: var(--sun); transform: translateY(-3px); }
.racer canvas.facec { width: 52px; height: 52px; }
.racer .animal { font-size: 12px; color: #6b5d87; margin-top: -4px; }
.racer b { font-weight: 400; font-size: 17px; }
.stat { display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 4px; width: 100%; font-size: 11px; color: #6b5d87; }
.stat i { display: block; height: 6px; border-radius: 3px; background: #e9e1f5; overflow: hidden; }
.stat i::before { content: ""; display: block; height: 100%; width: var(--v); background: var(--berry); }
.seg { display: flex; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: #fff; }
.seg button { flex: 1; border: 0; background: transparent; padding: 10px 8px; font-size: 16px; color: var(--ink); border-right: 3px solid var(--ink); min-height: 44px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--sky); color: #fff; }
.tracks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.trk { border: 3px solid var(--ink); border-radius: 14px; padding: 10px; text-align: left; color: var(--ink); box-shadow: 0 4px 0 var(--ink); min-height: 64px; }
.trk small { display: block; font-size: 12px; opacity: .75; }
.trk.on { outline: 4px solid var(--berry); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 16px; }
.check input { width: 22px; height: 22px; accent-color: var(--berry); }
.res { width: 100%; border-collapse: collapse; font-size: 17px; color: var(--ink); font-family: var(--font); }
.res td { padding: 6px 6px; border-bottom: 2px dashed #d9cdea; }
.res tr.me td { background: #ffe9a3; }
.res .p { width: 44px; font-size: 22px; }
.res .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); vertical-align: -1px; margin-right: 6px; }
.res .r { text-align: right; font-variant-numeric: tabular-nums; }
.help-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 16px; line-height: 1.45; }
.kbd { background: #fff; border: 2px solid var(--ink); border-radius: 6px; padding: 0 6px; font-size: 14px; }

/* ── HUD ── */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
.hud-tl { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: flex-start; }
.hud-tr { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); right: calc(12px + env(safe-area-inset-right, 0px)); display: grid; justify-items: end; gap: 6px; }
.hud-tc { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; }
.lapbox { font-size: 22px; line-height: 1; color: #fff; }
.lapbox b { font-size: 34px; font-weight: 400; }
.timer { font-size: 18px; color: #fff; font-variant-numeric: tabular-nums; }
#pos { font-size: 72px; line-height: .9; color: var(--sun); }
#pos sup { font-size: 26px; vertical-align: top; margin-left: 2px; }
#map { width: 110px; height: 110px; }
#itemslot {
  width: 74px; height: 74px; border-radius: 50%; background: rgba(255, 246, 230, .9); border: 4px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink); display: grid; place-items: center;
}
#itemslot svg { width: 50px; height: 50px; }
#gems { font-size: 18px; color: #fff; }
#gems i { display: inline-block; width: 13px; height: 13px; background: #49e4ff; transform: rotate(45deg); border: 2px solid var(--ink); margin-right: 6px; }
#pauseBtn {
  pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 3px solid var(--ink); background: var(--cream); color: var(--ink);
  box-shadow: 0 3px 0 var(--ink); font-size: 18px;
}
#banner {
  position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-size: clamp(54px, 14vw, 120px); color: var(--sun);
  opacity: 0; transform: scale(.6);
}
#banner.show { animation: pop 1.1s ease-out forwards; }
#banner.small { font-size: clamp(30px, 7vw, 56px); color: #fff; }
@keyframes pop { 0% { opacity: 0; transform: scale(.5); } 15% { opacity: 1; transform: scale(1.12); } 30% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: scale(1.05); } }
#warn { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 26px; color: var(--berry); display: none; }
.speedo { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); font-size: 20px; color: #fff; }
.keys { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: calc(14px + env(safe-area-inset-left, 0px)); font-size: 14px; color: #fff; text-shadow: 0 2px 0 var(--ink); }

/* touch pads */
#touch { display: none; }
.touch #touch { display: block; }
.touch .keys { display: none; }
.pad {
  pointer-events: auto; position: absolute; border-radius: 50%; border: 4px solid var(--ink); background: rgba(255, 246, 230, .78);
  color: var(--ink); display: grid; place-items: center; font-size: 30px; box-shadow: 0 5px 0 var(--ink); touch-action: none;
}
.pad.held { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); background: var(--sun); }
#bL { left: calc(14px + env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 82px; height: 82px; }
#bR { left: calc(108px + env(safe-area-inset-left, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 82px; height: 82px; }
#bDrift { right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 96px; height: 96px; font-size: 19px; background: rgba(255, 79, 139, .85); color: #fff; }
#bItem { right: calc(120px + env(safe-area-inset-right, 0px)); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width: 70px; height: 70px; font-size: 16px; }
#bBrake { right: calc(30px + env(safe-area-inset-right, 0px)); bottom: calc(132px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: 14px; }
.touch .speedo { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }

#panel {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); pointer-events: auto;
  display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: center; align-items: center;
  background: rgba(255, 246, 230, .93); color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 var(--ink);
  padding: 8px 10px; width: max-content; max-width: calc(100vw - 20px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
}
.pgroup { display: flex; align-items: center; gap: 6px; }
.plabel { font-size: 14px; color: #5a4c78; }
.seg.mini button { padding: 6px 10px; font-size: 15px; min-height: 42px; min-width: 50px; white-space: nowrap; }
.seg.mini button.on.attack { background: var(--berry); } .seg.mini button.on.safe { background: var(--leaf); }
.tbtn.mini { white-space: nowrap; padding: 8px 12px; font-size: 15px; box-shadow: 0 3px 0 var(--ink); border-radius: 12px; min-height: 42px; }
.tbtn.mini:disabled { opacity: .45; }
#autoBtn { background: var(--leaf); color: #fff; } #autoBtn.off { background: #d9cdea; color: var(--ink); }
#feed {
  position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: 120px;
  display: grid; gap: 4px; max-width: min(380px, 72vw); font-size: 15px; justify-items: start;
}
#feed div { background: rgba(29, 18, 53, .78); color: #fff; padding: 4px 10px; border-radius: 10px; border-left: 5px solid var(--sky); animation: feedin .25s ease-out; }
#feed div.good { border-left-color: var(--leaf); } #feed div.bad { border-left-color: var(--berry); } #feed div.item { border-left-color: var(--sun); }
#caster {
  position: absolute; top: calc(104px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
  width: min(560px, calc(100vw - 24px)); display: flex; gap: 6px; align-items: flex-start; pointer-events: none;
}
#caster canvas { width: 46px; height: 46px; flex: none; }
#caster .bubble {
  flex: 1; min-width: 0; background: var(--cream); color: var(--ink); border: 3px solid var(--ink); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink); padding: 5px 12px 7px; font-size: 16px; line-height: 1.4;
}
#caster .who { font-size: 12px; color: #6b5d87; display: flex; gap: 6px; align-items: center; }
@media (max-width: 640px) { #caster { left: 12px; transform: none; width: calc(100vw - 120px); } }
@media (max-height: 500px) { #caster { top: calc(92px + env(safe-area-inset-top, 0px)); left: 12px; transform: none; width: min(420px, 48vw); } #caster .bubble { font-size: 14px; } }
@keyframes feedin { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.setup2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
.hint { margin: 6px 0 0; font-size: 13px; color: #6b5d87; }
@media (max-width: 640px) { .setup2 { grid-template-columns: minmax(0, 1fr); } .pgroup.lab { flex-direction: column; gap: 2px; } .plabel { font-size: 12px; line-height: 1; } .seg.mini button { min-width: 44px; padding: 6px 8px; } .tbtn.mini { padding: 8px 9px; } #panel { gap: 6px 10px; } }

@media (max-width: 640px) {
  .racers { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .racer canvas.facec { width: 42px; height: 42px; }
  .stat { display: none; }
  .tracks { grid-template-columns: minmax(0, 1fr); }
  #pos { font-size: 56px; }
  #map { width: 84px; height: 84px; }
  #itemslot { width: 62px; height: 62px; } #itemslot svg { width: 42px; height: 42px; }
  .lapbox b { font-size: 28px; }
}
@media (max-height: 500px) {
  #pos { font-size: 50px; } #pos sup { font-size: 20px; }
  #map { width: 76px; height: 76px; }
  #itemslot { width: 58px; height: 58px; } #itemslot svg { width: 40px; height: 40px; }
  .lapbox b { font-size: 26px; }
  #bBrake { bottom: calc(126px + env(safe-area-inset-bottom, 0px)); width: 52px; height: 52px; font-size: 12px; }
}
@media (max-height: 500px) {
  #panel { flex-wrap: nowrap; gap: 6px; padding: 5px 8px; border-radius: 14px; }
  #panel .plabel { display: none; }
  #panel .seg.mini button { min-height: 38px; min-width: 40px; padding: 4px 8px; font-size: 14px; }
  #panel .tbtn.mini { min-height: 38px; padding: 5px 8px; font-size: 14px; }
}
@media (prefers-reduced-motion: reduce) { #banner.show { animation-duration: .01s; opacity: 1; transform: none; } .tbtn { transition: none; } }
</style>

<canvas id="c" aria-label="레이스 화면 (위에서 본 코스)"></canvas>

<script>

const $ = (id) => document.getElementById(id);
const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
if (isTouch) document.body.classList.add("touch");

// ═════════════ 데이터 ═════════════

const THEMES = {

};
const TRACKS = [
  { name: "선샤인 초원", sub: "완만한 언덕, 첫 레이스용", theme: "meadow",
    pts: [[0, 0, 0], [90, 0, 0], [150, 3, 40], [160, 6, 110], [110, 8, 160], [40, 5, 140], [0, 2, 190], [-80, 0, 190], [-140, 0, 130], [-120, 0, 60], [-60, 0, 40]] },
  { name: "선셋 캐니언", sub: "급커브와 고갯길", theme: "canyon",
    pts: [[0, 0, 0], [100, 0, -20], [170, 6, 20], [150, 12, 90], [80, 14, 80], [60, 10, 140], [120, 6, 190], [60, 2, 250], [-40, 0, 230], [-90, 4, 160], [-40, 8, 110], [-100, 4, 50], [-60, 0, 0]] },

const LAPS = 3;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = (a) => { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; };
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r, fill, stroke, lw) {

}

const OUTLINE = "#3a2a55";

// ═════════════ 트랙 ═════════════
let TR = null;

// 구심 Catmull-Rom (닫힌 곡선)
function crPoint(p0, p1, p2, p3, t) {
  const tj = (ti, a, b) => ti + Math.sqrt(Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z)) + 1e-6;
  const t0 = 0, t1 = tj(t0, p0, p1), t2 = tj(t1, p1, p2), t3 = tj(t2, p2, p3);
  const tt = lerp(t1, t2, t);
  const L = (a, b, ta, tb) => { const u = (tt - ta) / (tb - ta); return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u, z: a.z + (b.z - a.z) * u }; };
  const A1 = L(p0, p1, t0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3);
  return L(L(A1, A2, t0, t2), L(A2, A3, t1, t3), t1, t2);
}
function sampleTrack(pts) {
  const n = pts.length, dense = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let s = 0; s < 40; s++) dense.push(crPoint(p0, p1, p2, p3, s / 40));
  }
  const cum = [0];
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length];
    cum.push(cum[i - 1] + Math.hypot(b.x - a.x, b.z - a.z));
  }
  const len = cum[cum.length - 1], N = Math.round(len / 2), P = [];
  let j = 0;
  for (let k = 0; k < N; k++) {
    const d = (k / N) * len;
    while (cum[j + 1] < d) j++;
    const a = dense[j], b = dense[(j + 1) % dense.length], u = (d - cum[j]) / (cum[j + 1] - cum[j] || 1);
    P.push({ x: lerp(a.x, b.x, u), y: 0, z: lerp(a.z, b.z, u) });
  }
  return { P, N, len };
}

function buildTrack(idx) {
  const def = TRACKS[idx], th = THEMES[def.theme];
  const { P, N, len } = sampleTrack(def.pts.map((p) => ({ x: p[0], y: p[1], z: p[2] })));
  const T = [], NR = [];
  for (let i = 0; i < N; i++) {
    const a = P[(i - 1 + N) % N], b = P[(i + 1) % N];
    const dx = b.x - a.x, dz = b.z - a.z, l = Math.hypot(dx, dz) || 1;
    T.push({ x: dx / l, y: 0, z: dz / l });
    NR.push({ x: -dz / l, y: 0, z: dx / l });
  }
  const path = new Path2D();
  P.forEach((p, i) => (i ? path.lineTo(p.x, p.z) : path.moveTo(p.x, p.z)));
  path.closePath();
  const xs = P.map((p) => p.x), zs = P.map((p) => p.z);
  const bbox = { x0: Math.min(...xs) - WALL - 4, x1: Math.max(...xs) + WALL + 4, z0: Math.min(...zs) - WALL - 4, z1: Math.max(...zs) + WALL + 4 };
  TR = { idx, def, th, N, P, T, NR, len, path, bbox, boxes: [], gems: [], decor: [], flowers: [], bumpers: [], clouds: [], minimap: null };

  const distToTrack = (x, z) => { let b = Infinity; for (let i = 0; i < N; i += 2) { const p = P[i], d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < b) b = d; } return Math.sqrt(b); };
  const R = (a, b) => lerp(a, b, Math.random());
  const M = 70;
  // 장식 (나무, 선인장, 눈사람…)
  for (let tries = 0; TR.decor.length < 170 && tries < 4000; tries++) {
    const x = R(bbox.x0 - M, bbox.x1 + M), z = R(bbox.z0 - M, bbox.z1 + M);
    if (distToTrack(x, z) < WALL + 4) continue;
    const r = Math.random();
    const type = th.deco === "tree" ? (r < 0.62 ? "tree" : r < 0.88 ? "bush" : "mushroom")
      : th.deco === "cactus" ? (r < 0.5 ? "cactus" : r < 0.9 ? "rock" : "bush")
        : (r < 0.72 ? "pine" : r < 0.86 ? "snowman" : "rock");
    TR.decor.push({ x, z, type, s: R(0.8, 1.35), seed: Math.random() * 100 });
  }
  TR.decor.sort((a, b) => a.z - b.z);
  // 꽃 / 조약돌 / 눈 반짝이
  for (let tries = 0; TR.flowers.length < 650 && tries < 6000; tries++) {
    const x = R(bbox.x0 - M, bbox.x1 + M), z = R(bbox.z0 - M, bbox.z1 + M);
    if (distToTrack(x, z) < W / 2 + 2.5) continue;
    TR.flowers.push({ x, z, c: th.flowers[Math.floor(Math.random() * th.flowers.length)], s: R(0.7, 1.2) });
  }
  // 경계 범퍼 (사탕 색)
  for (let i = 0; i < N; i += 4) for (const side of [-1, 1]) {
    const p = P[i], n = NR[i];
    TR.bumpers.push({ x: p.x + n.x * side * (WALL + 0.7), z: p.z + n.z * side * (WALL + 0.7), c: th.bumpers[(i / 4) % th.bumpers.length] });
  }
  // 구름 그림자
  for (let i = 0; i < 9; i++) TR.clouds.push({ x: R(bbox.x0, bbox.x1), z: R(bbox.z0, bbox.z1), s: R(10, 18) });
  // 아이템 상자
  for (const f of [0.18, 0.43, 0.68, 0.88]) {
    const i = Math.floor(N * f), p = P[i], n = NR[i];
    for (const off of [-5.2, -1.75, 1.75, 5.2]) TR.boxes.push({ x: p.x + n.x * off, z: p.z + n.z * off, y: 0, idx: i, off, respawn: 0 });
  }
  // 젬
  for (const f of [0.08, 0.3, 0.55, 0.78]) {
    const base = Math.floor(N * f), off = (Math.random() - 0.5) * W * 0.6;
    for (let j = 0; j < 5; j++) {
      const i = (base + j * 3) % N, p = P[i], n = NR[i];
      TR.gems.push({ x: p.x + n.x * off, z: p.z + n.z * off, respawn: 0, ph: j * 0.7 });
    }
  }
  buildMinimap();
}

function buildMinimap() {
  const c = document.createElement("canvas");
  c.width = c.height = 220;
  const g = c.getContext("2d");
  const { x0, x1, z0, z1 } = TR.bbox;
  const sc = 196 / Math.max(x1 - x0, z1 - z0);
  const ox = 110 - ((x0 + x1) / 2) * sc, oz = 110 - ((z0 + z1) / 2) * sc;
  const map = (x, z) => [ox + x * sc, oz + z * sc];
  g.lineJoin = "round";
  for (const [w, s] of [[16, OUTLINE], [9, "#fff6e6"]]) {
    g.beginPath();
    TR.P.forEach((p, i) => { const [x, y] = map(p.x, p.z); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath();
    g.lineWidth = w; g.strokeStyle = s; g.stroke();
  }
  const [sx, sy] = map(TR.P[0].x, TR.P[0].z);
  g.fillStyle = "#ff4f8b"; g.fillRect(sx - 6, sy - 6, 12, 12);
  TR.minimap = { canvas: c, map };
}

// ═════════════ 카트 ═════════════
let K = [];
let player = null;
const hazards = [], rockets = [];

function clearKarts() {
  K = [];
  hazards.length = 0; rockets.length = 0;
  if (typeof particles !== "undefined") particles.length = 0;
}

function spawnKarts(withPlayer) {
  clearKarts();
  const N = TR.N;
  const order = RACERS.map((_, i) => i);
  // 플레이어는 뒤쪽 그리드(6번째)에서 출발
  if (withPlayer) {
    const pi = S.sel.racer;
    order.splice(order.indexOf(pi), 1);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    order.splice(5, 0, pi);
  }
  const ai = CC[S.sel.cc].ai;
  order.forEach((ri, slot) => {
    const row = Math.floor(slot / 2), side = slot % 2 ? 1 : -1;
    const idx = (N - 5 - row * 6 - (slot % 2) * 3 + N) % N;
    const p = TR.P[idx], n = TR.NR[idx], t = TR.T[idx];
    const k = {
      id: slot, ri, racer: RACERS[ri], isPlayer: withPlayer && ri === S.sel.racer,
      x: p.x + n.x * side * 3.4, z: p.z + n.z * side * 3.4, y: p.y, heading: Math.atan2(t.x, t.z),
      speed: 0, drift: 0, driftT: 0, boostT: 0, spinT: 0, shieldT: 0, hopT: 0, wallT: 0,
      item: null, uses: 0, rouletteT: 0, gems: 0, idx, lap: 0, checkpoint: true, prog: idx - N,
      finished: false, finishTime: 0, rank: slot + 1,
      lane: (Math.random() - 0.5) * W * 0.5, laneT: 0, aiItemT: 1 + Math.random(),
      baseSkill: lerp(ai[0], ai[1], Math.random()), skill: 1, steerVis: 0, pitch: 0, wrongT: 0,
      style: ["attack", "balanced", "balanced", "safe"][Math.floor(Math.random() * 4)], plan: "balanced",
      st: { speed: RACERS[ri].speed, accel: RACERS[ri].accel, handling: RACERS[ri].handling, off: 0.5 }, lastRank: slot + 1, mistakes: 0,
    };
    if (k.isPlayer) {
      const e = ENGINES[S.sel.engine], t = TIRES[S.sel.tire];
      k.baseSkill = lerp(ai[0], ai[1], 0.75);
      k.st = { speed: k.racer.speed + e.sp + t.sp, accel: k.racer.accel + e.ac + t.ac, handling: k.racer.handling + e.hd + t.hd, off: 0.5 + e.off + t.off };
    }
    k.prog = k.lap * N + k.idx - N;
    K.push(k);
    if (k.isPlayer) player = k;
  });
  if (!withPlayer) player = null;
  S.ccMax = CC[S.sel.cc].max;
}

function nearestIdx(x, z, start, win) {
  const N = TR.N, P = TR.P;
  let best = start, bd = Infinity;
  for (let o = -win; o <= win; o++) {
    const i = (start + o + N) % N, p = P[i];
    const d = (p.x - x) ** 2 + (p.z - z) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
const latOf = (x, z, i) => (x - TR.P[i].x) * TR.NR[i].x + (z - TR.P[i].z) * TR.NR[i].z;

// ═════════════ 아이템 ═════════════
function rollItem(rank) {
  const tables = rank <= 2
    ? { oil: 45, shield: 30, nitro: 25 }
    : rank <= 5
      ? { nitro: 32, oil: 22, rocket: 28, shield: 12, triple: 6 }
      : { nitro: 25, triple: 25, rocket: 35, shield: 15 };
  let r = Math.random() * 100;
  for (const [k, w] of Object.entries(tables)) { r -= w; if (r < 0) return k; }
  return "nitro";
}
function assignItem(k) {
  k.item = rollItem(k.rank);
  k.uses = k.item === "triple" ? 3 : 1;
  if (k.isPlayer) { sfx(660, 990, 0.12, "triangle", 0.12); updateItemSlot(); radio(`아이템 획득: ${ITEM_NAME[k.item]}`, "item"); }
}
function useItem(k) {
  if (!k.item || k.rouletteT > 0 || k.spinT > 0) return;
  const it = k.item;
  if (k.isPlayer) { radio(`${S.autoFired ? "자동 사용" : "지시대로 사용"}: ${ITEM_NAME[it]}${k.item === "triple" && k.uses > 1 ? ` (남은 ${k.uses - 1})` : ""}`, "item"); S.autoFired = false; }
  const fx = Math.sin(k.heading), fz = Math.cos(k.heading);
  if (it === "nitro" || it === "triple") {
    k.boostT = Math.max(k.boostT, 1.3);
    k.speed += 6;
    if (k.isPlayer) sfx(200, 700, 0.35, "sawtooth", 0.12);
  } else if (it === "oil") {
    const x = k.x - fx * 3.2, z = k.z - fz * 3.2;
    hazards.push({ x, z, owner: k, t: 0 });
    if (hazards.length > 14) hazards.shift();
    if (k.isPlayer) sfx(300, 120, 0.2, "square", 0.08);
  } else if (it === "rocket") {
    castEvent(`${k.racer.name}(${k.rank}위)가 추적 로켓 발사`, k.isPlayer || k.rank <= 4 ? 2 : 1);
    const ahead = K.filter((o) => o !== k && !o.finished && o.prog > k.prog).sort((a, b) => a.prog - b.prog)[0] || null;
    rockets.push({ owner: k, target: ahead, prog: k.prog + 2, lat: latOf(k.x, k.z, k.idx), t: 0, x: k.x, z: k.z, ang: 0 });
    if (k.isPlayer) sfx(500, 1400, 0.3, "sawtooth", 0.1);
  } else if (it === "shield") {
    k.shieldT = 7;
    if (k.isPlayer || k.rank <= 2) castEvent(`${k.racer.name}(${k.rank}위)가 방패 버블을 켰다`, 1);
    if (k.isPlayer) sfx(400, 800, 0.25, "sine", 0.15);
  }
  k.uses--;
  if (k.uses <= 0) k.item = null;
  if (k.isPlayer) updateItemSlot();
}
function hitKart(k, by) {
  if (k.shieldT > 0) { if (k.isPlayer) radio("방패가 공격을 막아냈다!", "good"); if (by && by.isPlayer) radio(`${k.racer.name}의 방패에 막혔다`, "info"); k.shieldT = 0; if (k.isPlayer) sfx(900, 300, 0.2, "triangle", 0.12); return false; }
  if (k.spinT > 0) return false;
  k.spinT = 1.15;
  k.speed *= 0.35;
  k.drift = 0; k.driftT = 0; k.boostT = 0;
  k.gems = Math.max(0, k.gems - 2);
  castEvent(by ? `${by.racer.name}의 공격에 ${k.racer.name}(${k.rank}위)가 빙글빙글 스핀` : `${k.racer.name}(${k.rank}위)가 미끄러져 스핀`, k.isPlayer || k.rank <= 3 || (by && by.isPlayer) ? 2 : 1);
  if (k.isPlayer) { sfx(400, 80, 0.45, "square", 0.15); vibrate(80); radio(by ? `${by.racer.name}의 공격에 맞았다!` : "미끄러졌다!", "bad"); }
  else if (by && by.isPlayer) radio(`명중! ${k.racer.name} 스핀`, "good");
  return true;
}

// ═════════════ 물리 ═════════════
function releaseDrift(k) {
  const lvl = k.driftT > 3 ? 3 : k.driftT > 2 ? 2 : k.driftT > 1 ? 1 : 0;
  if (lvl === 3 && (k.rank <= 3 || k.isPlayer)) castEvent(`${k.racer.name}(${k.rank}위) 보라색 드리프트 부스트 폭발`, 1);
  if (lvl) {
    k.boostT = Math.max(k.boostT, [0, 0.6, 1.0, 1.5][lvl]);
    k.speed += [0, 3, 5, 7][lvl];
    if (k.isPlayer) { sfx(250 + lvl * 120, 900 + lvl * 200, 0.3, "sawtooth", 0.1); if (lvl >= 2) radio(`${["", "", "주황", "보라"][lvl]} 드리프트 부스트!`, "good"); }
  }
  k.drift = 0; k.driftT = 0;
}

function updateKart(k, dt, c) {
  const r = k.st, N = TR.N;
  k.boostT = Math.max(0, k.boostT - dt);
  k.shieldT = Math.max(0, k.shieldT - dt);
  k.hopT = Math.max(0, k.hopT - dt);
  k.wallT = Math.max(0, k.wallT - dt);
  if (k.rouletteT > 0) { k.rouletteT -= dt; if (k.rouletteT <= 0) assignItem(k); }

  const lat0 = latOf(k.x, k.z, k.idx);
  const off = Math.abs(lat0) > W / 2 + 1.4;
  let max = S.ccMax * r.speed * (1 + k.gems * 0.006) * k.skill;
  if (k.boostT > 0) max *= 1.38;
  if (off) max *= k.boostT > 0 ? 0.82 : r.off;

  if (k.spinT > 0) {
    k.spinT -= dt;
    k.speed *= Math.exp(-2.5 * dt);
  } else {
    if (c.brake) k.speed = Math.max(-8, k.speed - 32 * dt);
    else if (c.gas) {
      if (k.speed < max) k.speed = Math.min(max, k.speed + r.accel * 22 * dt * (1.15 - Math.max(0, k.speed) / max));
      else k.speed = Math.max(max, k.speed - 16 * dt);
    } else {
      k.speed *= Math.exp(-0.8 * dt);
      if (k.speed > max) k.speed = Math.max(max, k.speed - 16 * dt);
    }
    const s = c.steer;
    if (c.drift && !k.drift && Math.abs(s) > 0.25 && k.speed > 11) { k.drift = Math.sign(s); k.driftT = 0; k.hopT = 0.25; }
    if (k.drift && (!c.drift || k.speed < 7)) releaseDrift(k);
    if (k.drift) {
      const d = k.drift;
      k.heading -= d * (1.0 + 0.8 * s * d) * r.handling * dt;
      k.driftT += dt * (0.75 + 0.55 * Math.max(0, s * d));
      k.speed -= 1.5 * dt;
    } else {
      const sf = clamp(Math.abs(k.speed) / 8, 0, 1) * (1 - 0.28 * clamp(k.speed / S.ccMax, 0, 1));
      k.heading -= s * 1.95 * r.handling * sf * dt * (k.speed < 0 ? -1 : 1);
    }
    if (c.item) useItem(k);
  }
  k.steerVis = lerp(k.steerVis, k.spinT > 0 ? 0 : c.steer, Math.min(1, dt * 10));

  const fx = Math.sin(k.heading), fz = Math.cos(k.heading);
  k.x += fx * k.speed * dt;
  k.z += fz * k.speed * dt;

  const prev = k.idx;
  k.idx = nearestIdx(k.x, k.z, k.idx, 18);
  const dIdx = k.idx - prev;
  if (dIdx < -N / 2) { if (k.checkpoint) { k.lap++; k.checkpoint = false; onLap(k); } }
  else if (dIdx > N / 2) { k.lap--; k.checkpoint = true; }
  if (k.idx > N * 0.4 && k.idx < N * 0.6) k.checkpoint = true;
  k.prog = (k.lap - 1) * N + k.idx;

  const lat = latOf(k.x, k.z, k.idx);
  if (Math.abs(lat) > WALL) {
    const ex = Math.abs(lat) - WALL, sg = Math.sign(lat), n = TR.NR[k.idx], t = TR.T[k.idx];
    k.x -= n.x * sg * ex; k.z -= n.z * sg * ex;
    if (k.wallT <= 0) { k.speed *= 0.72; k.wallT = 0.4; if (k.isPlayer) { sfx(140, 60, 0.15, "square", 0.12); vibrate(30); } }
    k.heading += wrap(Math.atan2(t.x, t.z) - k.heading) * Math.min(1, dt * 6);
  }
  const p = TR.P[k.idx], pn = TR.P[(k.idx + 2) % N];
  k.y = lerp(k.y, p.y, Math.min(1, dt * 12));
  k.pitch = lerp(k.pitch, -Math.atan2(pn.y - p.y, 4), Math.min(1, dt * 6));

  // 역주행 감지
  const t = TR.T[k.idx];
  if (k.isPlayer) {
    if (fx * t.x + fz * t.z < -0.3 && k.speed > 3) k.wrongT += dt; else k.wrongT = 0;
  }
}

function onLap(k) {
  if (k.lap > LAPS && !k.finished) {
    k.finished = true;
    k.finishTime = S.raceTime;
    const place = K.filter((o) => o.finished).length;
    if (place === 1 || k.isPlayer) castEvent(place === 1 ? `${k.racer.name} 1위로 결승선 통과! 우승` : `${k.racer.name} ${place}위로 결승선 통과`, 3);
    if (k.isPlayer) playerFinished();
    return;
  }
  if (k.isPlayer && k.lap >= 2) {
    showBanner(k.lap === LAPS ? "마지막 랩!" : `LAP ${k.lap}`, true);
    radio(`${k.lap}랩 진입 · 현재 ${k.rank}위`, "info");
    sfx(523, 784, 0.25, "triangle", 0.15);
  }
}

// ═════════════ AI ═════════════
function aiControl(k, dt) {
  const N = TR.N;
  const style = k.isPlayer ? S.sel.style : k.style;
  const plan = k.isPlayer ? S.sel.plan : k.plan;
  const ST = STYLES[style];
  // 뒤처진 차만 조금 따라잡는 보정 (모든 차에 동일하게 적용)
  const leaderProg = Math.max(...K.map((o) => o.prog));
  k.skill = k.baseSkill * ST.mul * (1 + clamp(((leaderProg - k.prog) / N) * 0.08, 0, 0.04));

  k.laneT -= dt;
  if (k.laneT <= 0) { k.laneT = 2 + Math.random() * 3; k.lane = (Math.random() - 0.5) * W * 0.6; }
  let lane = k.lane;
  if (!k.item && k.rouletteT <= 0) {
    for (const b of TR.boxes) {
      const ahead = (b.idx - k.idx + N) % N;
      if (b.respawn <= 0 && ahead > 4 && ahead < 30) { if (Math.abs(b.off - lane) < 4) { lane = b.off; break; } }
    }
  }
  const look = 7 + Math.floor(Math.max(0, k.speed) * 0.2);
  const ti = (k.idx + look) % N, p = TR.P[ti], n = TR.NR[ti];
  const desired = Math.atan2(p.x + n.x * lane - k.x, p.z + n.z * lane - k.z);
  const diff = wrap(desired - k.heading);
  let steer = clamp(-diff * 2.4, -1, 1);
  const tA = TR.T[k.idx], tB = TR.T[(k.idx + 18) % N];
  const curve = wrap(Math.atan2(tB.x, tB.z) - Math.atan2(tA.x, tA.z));
  let drift = false;
  if (k.drift) {
    drift = Math.abs(curve) > 0.12 || k.driftT < 0.5;
    if (Math.sign(-diff) !== k.drift && Math.abs(diff) > 0.35) drift = false;
  } else if (Math.abs(curve) > ST.driftAt && k.speed > 14 && Math.random() < dt * ST.driftRate) {
    drift = true;
    steer = curve > 0 ? -1 : 1;
  }
  // 무리한 드리프트는 실수로 이어질 수 있음
  if (k.drift && k.spinT <= 0 && S.state !== "attract" && Math.random() < dt * ST.mistake * (1 + Math.abs(curve))) {
    k.spinT = 0.6; k.speed *= 0.6; k.drift = 0; k.driftT = 0; k.mistakes++;
    castEvent(`${k.racer.name}(${k.rank}위)가 무리한 드리프트로 코스 이탈`, k.isPlayer || k.rank <= 3 ? 2 : 1);
    if (k.isPlayer) radio(`${k.racer.name}: 코스 이탈! 무리했어요`, "bad");
  }

  let item = false;
  k.aiItemT -= dt;
  if (k.item && k.rouletteT <= 0) k.holdT = (k.holdT || 0) + dt; else k.holdT = 0;
  const autoOn = !k.isPlayer || S.sel.autoItem;
  if (autoOn && k.item && k.rouletteT <= 0 && k.aiItemT <= 0 && k.spinT <= 0) {
    k.aiItemT = 0.25;
    const it = k.item;
    const behind = (d) => K.some((o) => o !== k && k.prog - o.prog > 1 && k.prog - o.prog < d);
    const ahead = (d) => K.some((o) => o !== k && !o.finished && o.prog > k.prog && o.prog - k.prog < d);
    const straight = Math.abs(curve) < 0.3;
    const slowed = k.speed < S.ccMax * 0.6;
    const incoming = rockets.some((r) => r.target === k);
    const left = LAPS * N - k.prog;               // 남은 거리(샘플)
    const endgame = left < N * 0.3;                // 마지막 랩 후반: 남은 아이템은 모두 소진
    const isBoost = it === "nitro" || it === "triple";
    const boostReady = isBoost && k.boostT < 0.15 && (straight || slowed);
    if (endgame && (!isBoost || boostReady)) item = true;
    else if (it === "shield" && incoming) item = true;
    else if (plan === "attack") {
      if (boostReady) item = true;
      else if (it === "rocket" && ahead(250)) item = true;
      else if (it === "oil" && (behind(30) || k.holdT > 4)) item = true;
      else if (it === "shield" && (behind(8) || k.holdT > 5)) item = true;
    } else if (plan === "defend") {
      if (boostReady && (k.lap >= LAPS || k.rank > 4 || slowed)) item = true;
      else if (it === "rocket" && ahead(40)) item = true;
      else if (it === "oil" && behind(6)) item = true;
    } else {
      if (boostReady) item = true;
      else if (it === "rocket" && (ahead(120) || k.holdT > 6)) item = true;
      else if (it === "oil" && (behind(14) || k.holdT > 6)) item = true;
      else if (it === "shield" && (behind(10) || k.holdT > 7)) item = true;
    }
    if (item && k.isPlayer) S.autoFired = true;
  }
  if (k.isPlayer && S.manualItem) { S.manualItem = false; if (k.item && k.rouletteT <= 0) item = true; }
  return { steer, gas: true, brake: false, drift, item };
}

// ═════════════ 감독 지시 ═════════════
function setStyle(v) { if (S.sel.style === v) return; S.sel.style = v; saveSel(); syncPanel(); if (player && S.state !== "attract") radio(`지시: ${STYLES[v].name} 주행`, "info"); }
function setPlan(v) { if (S.sel.plan === v) return; S.sel.plan = v; saveSel(); syncPanel(); if (player && S.state !== "attract") radio(`지시: 아이템 ${PLANS[v]} 운용`, "info"); }

function cycleCam() {
  if (!CAMS.includes(S.sel.cam)) S.sel.cam = "chase"; S.sel.cam = CAMS[(CAMS.indexOf(S.sel.cam) + 1) % CAMS.length]; saveSel(); camSnap = true; syncPanel(); }
function cycleSpeed() { S.sel.speed = S.sel.speed >= 3 ? 1 : S.sel.speed + 1; saveSel(); syncPanel(); }

$("segStyle").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setStyle(b.dataset.s); });
$("segPlan").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setPlan(b.dataset.p); });

function toggleAuto() {
  S.sel.autoItem = !S.sel.autoItem; saveSel(); syncPanel();
  if (player && S.state !== "attract") radio(S.sel.autoItem ? "아이템 자동 사용: 켜짐 (전략에 맞춰 알아서 사용)" : "아이템 자동 사용: 꺼짐 (지금 사용 버튼으로만)", "info");
}

window.addEventListener("keydown", (e) => {
  if (!(S.state === "race" || S.state === "countdown" || S.state === "finish")) return;
  const k = e.key.toLowerCase();
  if (k === "escape" || k === "p") togglePause();
  if (S.paused) return;
  if (k === "1") setStyle("attack"); else if (k === "2") setStyle("balanced"); else if (k === "3") setStyle("safe");
  else if (k === "q") setPlan("attack"); else if (k === "w") setPlan("balanced"); else if (k === "e") setPlan("defend");
  else if (k === " ") { e.preventDefault(); useNow(); }
  else if (k === "c") cycleCam(); else if (k === "f") cycleSpeed(); else if (k === "a") toggleAuto();
});

// 팀 무전 피드
let feedItems = [];
function radio(msg, kind) {
  const el = document.createElement("div");
  el.className = kind || "info";
  el.textContent = msg;
  const f = $("feed");
  f.appendChild(el);
  feedItems.push({ el, t: 5 });
  while (feedItems.length > 4) feedItems.shift().el.remove();
}
function tickFeed(dt) {
  for (let i = feedItems.length - 1; i >= 0; i--) {
    const it = feedItems[i];
    it.t -= dt;
    if (it.t < 0.6) it.el.style.opacity = Math.max(0, it.t / 0.6);
    if (it.t <= 0) { it.el.remove(); feedItems.splice(i, 1); }
  }
}
function placeFeed() {
  const p = $("panel");
  if (p && !$("hud").hidden) {
    $("feed").style.bottom = (p.offsetHeight + 22) + "px";
    // 하단 패널에 내 카트가 가리지 않도록 화면을 위로 올림
    viewOffY = Math.round((p.offsetHeight + 10) * 0.5);
  } else viewOffY = 0;
}
window.addEventListener("resize", placeFeed);
const vibrate = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { /* 미지원 */ } };

// ═════════════ 사운드 ═════════════
let AC = null, master = null, engOsc = null, engGain = null;
function initAudio() {
  if (AC) { if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = S.sel.sound ? 0.5 : 0;
    master.connect(AC.destination);
    engOsc = AC.createOscillator();
    engOsc.type = "sawtooth";
    const lp = AC.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 520;
    engGain = AC.createGain();
    engGain.gain.value = 0;
    engOsc.connect(lp); lp.connect(engGain); engGain.connect(master);
    engOsc.start();
  } catch (e) { AC = null; }
}
function sfx(f1, f2, dur, type, vol) {
  if (!AC || !S.sel.sound) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
function setSound(on) {
  S.sel.sound = on; saveSel();
  if (master) master.gain.value = on ? 0.5 : 0;
}

const CAST = { lastReal: -1e9, events: [], lastText: "", seen: 0, leaderId: -1, leaderLap: 0, typing: null, hideAt: 0 };

}
CAST.seq = 0;
function castReset() {
  CAST.events = []; CAST.lastText = ""; CAST.seen = 0; CAST.lastReal = -1e9;
  CAST.leaderId = -1; CAST.leaderLap = 0;

}

function raceSnapshot() {
  const order = [...K].sort((a, b) => a.rank - b.rank);
  const leader = order[0], avg = Math.max(10, S.ccMax * 0.85);
  const lines = order.map((k) => {
    const gap = k === leader ? "" : ` +${(((leader.prog - k.prog) * 2) / avg).toFixed(1)}초`;
    const tag = k.isPlayer ? " [감독 팀]" : "";
    const st = k.finished ? " (완주)" : k.spinT > 0 ? " (스핀 중)" : k.shieldT > 0 ? " (방패)" : k.boostT > 0 ? " (부스트)" : "";
    return `${k.rank}. ${k.racer.name}(${k.racer.animal})${tag}${gap}${st}`;
  });
  return { leader, lines };
}
const BASIC_OPEN = ["와!", "오오,", "지금!", "보셨나요?", "이야~", "놓치지 마세요,"];
function basicLine(fresh) {
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  if (fresh.length) {
    const e = fresh.reduce((a, b) => (b.prio >= a.prio ? b : a));
    return `${pick(BASIC_OPEN)} ${e.text}!`;
  }
  const { leader } = raceSnapshot();
  const second = K.find((k) => k.rank === 2);
  const avg = Math.max(10, S.ccMax * 0.85);
  const gap = second ? (((leader.prog - second.prog) * 2) / avg).toFixed(1) : "0";
  return pick([
    `현재 선두는 ${leader.racer.name}! ${second ? second.racer.name + "가 " + gap + "초 차로 쫓고 있어요" : ""}`,
    `${player.racer.name}, 지금 ${player.rank}위로 달리는 중이에요. 힘내요!`,
    `${leader.racer.name}의 리드가 이어지고 있어요. 역전이 나올까요?`,
  ]);
}

  clearInterval(CAST.typing);
  CAST.typing = setInterval(() => { i += 2; el.textContent = text.slice(0, i); if (i >= text.length) clearInterval(CAST.typing); }, 28);
  CAST.hideAt = performance.now() + 7000 + text.length * 60;

function castTick() {
  const box = $("caster");

  if (S.sel.cast === "off" || !player || S.paused) return;
  if (S.state !== "race" && S.state !== "finish") return;
  const now = performance.now();
  const fresh = CAST.events.filter((e) => e.id > CAST.seen);
  const hot = fresh.some((e) => e.prio >= 2);
  if (now - CAST.lastReal < 3500) return;
  if (!hot && now - CAST.lastReal < 14000) return;
  CAST.lastReal = now;
  CAST.seen = CAST.seq;
  showCast(basicLine(fresh.slice(-6)));
}

let camSnap = true, last = performance.now(), boxHue = 0, simClock = 0;

function puff(x, z, vx, vz, life, size, color, kind) {

function step(dt) {
  simClock += dt;
  const racing = S.state === "race" || S.state === "finish";
  if (S.state === "countdown") {
    const before = Math.ceil(S.countdown - 0.6);
    S.countdown -= dt;
    const after = Math.ceil(S.countdown - 0.6);
    if (after !== before && after >= 1 && after <= 3) { showBanner(String(after)); sfx(440, 440, 0.18, "square", 0.12); }
    if (S.countdown <= 0.6) { S.state = "race"; showBanner("GO!"); sfx(880, 880, 0.4, "square", 0.14); castEvent(`레이스 스타트! ${player ? player.racer.name + "는 " + player.rank + "번째 자리에서 출발" : ""}`, 3); }
  }
  if (racing || S.state === "attract") {
    if (racing) S.raceTime += dt;
    for (const k of K) updateKart(k, dt, aiControl(k, dt));
    // 카트 간 충돌
    for (let i = 0; i < K.length; i++) for (let j = i + 1; j < K.length; j++) {
      const a = K[i], b = K[j];
      const dx = b.x - a.x, dz = b.z - a.z, d2 = dx * dx + dz * dz;
      if (d2 < 4.4 && d2 > 0.0001) {
        const d = Math.sqrt(d2), push = (2.1 - d) / 2, nx = dx / d, nz = dz / d;
        a.x -= nx * push; a.z -= nz * push; b.x += nx * push; b.z += nz * push;
        if (a.shieldT > 0 && b.shieldT <= 0) hitKart(b, a);
        else if (b.shieldT > 0 && a.shieldT <= 0) hitKart(a, b);
        else { const avg = (a.speed + b.speed) / 2; a.speed = lerp(a.speed, avg, 0.2); b.speed = lerp(b.speed, avg, 0.2); }
        if (a.isPlayer || b.isPlayer) vibrate(15);
      }
    }
    // 아이템 상자, 젬
    boxHue = (boxHue + dt * 0.25) % 1;
    for (const b of TR.boxes) {
      if (b.respawn > 0) { b.respawn -= dt; continue; }
      for (const k of K) {
        if ((k.x - b.x) ** 2 + (k.z - b.z) ** 2 < 5.2) {
          b.respawn = 2.5;
          for (let i = 0; i < 6; i++) puff(b.x, b.z, (Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8, 0.5, 0.5, `hsl(${(boxHue * 360 + i * 60) % 360},90%,65%)`, "confetti");
          if (!k.item && k.rouletteT <= 0) { k.rouletteT = 1.1; if (k.isPlayer) sfx(700, 500, 0.08, "square", 0.08); }
          break;
        }
      }
    }
    for (const g of TR.gems) {
      if (g.respawn > 0) { g.respawn -= dt; continue; }
      for (const k of K) {
        if ((k.x - g.x) ** 2 + (k.z - g.z) ** 2 < 3.2) {
          g.respawn = 8;
          for (let i = 0; i < 5; i++) puff(g.x, g.z, Math.cos(i * 1.26) * 4, Math.sin(i * 1.26) * 4, 0.45, 0.35, "#bff6ff", "sparkle");
          if (k.gems < 10) k.gems++;
          if (k.isPlayer) sfx(1200, 1800, 0.08, "triangle", 0.1);
          break;
        }
      }
    }
    // 오일
    for (let i = hazards.length - 1; i >= 0; i--) {
      const h = hazards[i];
      h.t += dt;
      for (const k of K) {
        if (k === h.owner && h.t < 1) continue;
        if ((k.x - h.x) ** 2 + (k.z - h.z) ** 2 < 3.2) {
          hitKart(k, h.owner === k ? null : h.owner);
          hazards.splice(i, 1);
          break;
        }
      }
    }
    // 로켓
    const N = TR.N;
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.t += dt;
      r.prog += 31 * dt;
      let tLat = r.lat;
      if (r.target) {
        if (r.target.finished) r.target = null;
        else tLat = latOf(r.target.x, r.target.z, r.target.idx);
      }
      r.lat = lerp(r.lat, clamp(tLat, -WALL, WALL), Math.min(1, dt * 4));
      const fi = ((Math.floor(r.prog) % N) + N) % N, p = TR.P[fi], n = TR.NR[fi], t = TR.T[fi];
      r.x = p.x + n.x * r.lat; r.z = p.z + n.z * r.lat; r.ang = Math.atan2(t.z, t.x);
      if (Math.random() < 0.6) puff(r.x - t.x * 1.4, r.z - t.z * 1.4, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2, 0.5, 0.6, "rgba(255,255,255,.9)", "smoke");
      let done = r.t > 7;
      for (const k of K) {
        if (k === r.owner || done) continue;
        if ((k.x - r.x) ** 2 + (k.z - r.z) ** 2 < 5.5) { hitKart(k, r.owner); done = true; }
      }
      if (r.target && !done && r.prog > r.target.prog + 3) r.target = null;
      if (done) {
        for (let j = 0; j < 10; j++) puff(r.x, r.z, Math.cos(j * 0.63) * 7, Math.sin(j * 0.63) * 7, 0.5, 0.9, j % 2 ? "#ffd23f" : "#ff7a3d", "boom");
        rockets.splice(i, 1);
      }
    }
    // 순위
    const order = [...K].sort((a, b) => (a.finished && b.finished) ? a.finishTime - b.finishTime : a.finished ? -1 : b.finished ? 1 : b.prog - a.prog);
    order.forEach((k, i) => (k.rank = i + 1));
    if (S.state !== "attract") {
      const ld = order[0];
      if (CAST.leaderId !== -1 && ld.id !== CAST.leaderId && !ld.finished) castEvent(`${ld.racer.name}가 선두로 올라섰다`, 3);
      CAST.leaderId = ld.id;
      if (ld.lap !== CAST.leaderLap && ld.lap >= 2 && ld.lap <= LAPS) castEvent(ld.lap === LAPS ? `선두 ${ld.racer.name} 마지막 랩 진입` : `선두 ${ld.racer.name} ${ld.lap}랩 진입`, ld.lap === LAPS ? 3 : 2);
      CAST.leaderLap = ld.lap;
      if (player && player.rank !== player.castRank) {
        if (player.castRank && Math.abs(player.rank - player.castRank) >= 1) castEvent(`${player.racer.name} ${player.castRank}위에서 ${player.rank}위로 ${player.rank < player.castRank ? "상승" : "하락"}`, player.rank <= 3 || player.rank < player.castRank ? 2 : 1);
        player.castRank = player.rank;
      }
    }
    if (player && S.state === "race") {
      player.rankT = (player.rankT || 0) - dt;
      if (player.rank !== player.lastRank && player.rankT <= 0) {
        const up = player.rank < player.lastRank;
        const other = order[up ? player.rank : player.rank - 2];
        radio(up ? `추월 성공! ${other ? other.racer.name + " 제치고 " : ""}${player.rank}위` : `${other ? other.racer.name + "에게 " : ""}추월당함 · ${player.rank}위`, up ? "good" : "bad");
        player.lastRank = player.rank; player.rankT = 1.2;
      }
    }
    // 카트 연출 상태 + 파티클 발생
    for (const k of K) {
      k.spinVis = k.spinVis || 0;
      if (k.spinT > 0) k.spinVis += dt * 14;
      else k.spinVis = lerp(k.spinVis, Math.round(k.spinVis / TAU) * TAU, Math.min(1, dt * 10));
      k.driftVis = lerp(k.driftVis || 0, k.drift * 0.38, Math.min(1, dt * 8));
      const fx = Math.sin(k.heading), fz = Math.cos(k.heading);
      const off = Math.abs(latOf(k.x, k.z, k.idx)) > W / 2 + 1.4;
      if (off && k.speed > 6 && Math.random() < dt * 14) puff(k.x - fx * 1.6 + (Math.random() - 0.5), k.z - fz * 1.6 + (Math.random() - 0.5), -fx * 2, -fz * 2, 0.6, 0.7, TR.th.dust, "dust");
      const lvl = k.driftT > 3 ? 3 : k.driftT > 2 ? 2 : k.driftT > 1 ? 1 : 0;
      if (k.drift && lvl && Math.random() < dt * 30) {
        const side = Math.random() < 0.5 ? -1 : 1, rx = fz * side * 1.05, rz = -fx * side * 1.05;
        puff(k.x - fx * 1.2 + rx, k.z - fz * 1.2 + rz, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, 0.25, 0.32, SPARK[lvl], "spark");
      }
      if (k.boostT > 0 && Math.random() < dt * 20) puff(k.x - fx * 2.2, k.z - fz * 2.2, -fx * 3, -fz * 3, 0.35, 0.55, "rgba(255,255,255,.85)", "smoke");
    }
  }
  // 파티클
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.z += p.vz * dt;
    p.vx *= Math.exp(-3 * dt); p.vz *= Math.exp(-3 * dt);
  }
  for (const c of TR.clouds) { c.x += dt * 2.2; if (c.x > TR.bbox.x1 + 60) c.x = TR.bbox.x0 - 60; }

  updateCamera(dt);
  if (player && S.state !== "attract") updateHud();

  if (engGain) {
    const on = player && (S.state === "race" || S.state === "countdown" || S.state === "finish") && !S.paused && S.sel.sound;
    engGain.gain.value = on ? 0.03 : 0;
    if (on) engOsc.frequency.value = 70 + Math.max(0, player.speed) * 3.6 + (player.boostT > 0 ? 30 : 0);
  }

  if (S.state === "finish") {
    S.finishT -= dt;
    if (S.finishT <= 0) { S.state = "results"; viewResults(); if (engGain) engGain.gain.value = 0; }
  }
}

// ── 카메라 ──
function baseScale() { return clamp(Math.min(VW, VH) / 42, 7.5, 14); }
function updateCamera(dt) {
  if (!K.length) return;
  const leader = [...K].sort((a, b) => a.rank - b.rank)[0];
  let wx, wz, ws;
  const mode = S.state === "attract" ? "attract" : S.sel.cam;
  if (mode === "whole") {
    const b = TR.bbox, availH = VH - viewOffY * 2 - 150;
    ws = Math.min((VW - 30) / (b.x1 - b.x0), Math.max(80, availH) / (b.z1 - b.z0));
    wx = (b.x0 + b.x1) / 2; wz = (b.z0 + b.z1) / 2;
  } else {
    const t = mode === "chase" && player ? player : leader;
    const fx = Math.sin(t.heading), fz = Math.cos(t.heading), sp = Math.max(0, t.speed);
    wx = t.x + fx * sp * 0.35; wz = t.z + fz * sp * 0.35;
    ws = baseScale() * (mode === "attract" ? 0.8 : 1) * (1 - 0.14 * clamp(sp / S.ccMax, 0, 1.3));
  }
  const k = camSnap ? 1 : 1 - Math.exp(-dt * 5);
  cam.x = lerp(cam.x, wx, k); cam.z = lerp(cam.z, wz, k);
  cam.s = lerp(cam.s, ws, camSnap ? 1 : 1 - Math.exp(-dt * 3));
  camSnap = false;
}

// ── 그리기 ──
function drawDecor(c, d) {
  const s = d.s, x = d.x, z = d.z;
  const im = ART.decor[d.type];
  if (im) {
    const h = DECOR_H[d.type] * s, w = h * (im.width / im.height);
    ellipse(c, x, z + 0.2 * s, w * 0.45, 0.8 * s, "rgba(40,30,60,.14)");
    c.drawImage(im, x - w / 2, z - h + 0.3 * s, w, h);
    return;
  }
  c.save(); c.translate(x, z); c.scale(s, s);
  ellipse(c, 0, 0.2, 2.2, 0.8, "rgba(40,30,60,.14)");
  c.lineWidth = 0.18; c.strokeStyle = OUTLINE;
  if (d.type === "tree") {
    rrect(c, -0.45, -1.8, 0.9, 2, 0.3); c.fillStyle = "#a8714a"; c.fill(); c.stroke();
    for (const [ox, oy, r] of [[-1.1, -2.6, 1.5], [1.1, -2.6, 1.5], [0, -3.6, 1.9]]) circle(c, ox, oy, r, "#5fcf6b", OUTLINE, 0.18);
    circle(c, -0.6, -4.1, 0.6, "#8ee59a");
    if (d.seed % 3 < 1) for (const [ox, oy] of [[-1, -2.4], [0.7, -3.3], [1.3, -2.2]]) circle(c, ox, oy, 0.28, "#ff6b8b");
  } else if (d.type === "bush") {
    for (const [ox, r] of [[-1, 1], [1, 1], [0, 1.3]]) circle(c, ox, -0.9, r, TR.th.bush, OUTLINE, 0.16);
    circle(c, -0.4, -1.5, 0.35, "rgba(255,255,255,.45)");
  } else if (d.type === "mushroom") {
    rrect(c, -0.45, -1.3, 0.9, 1.4, 0.35); c.fillStyle = "#fff3dc"; c.fill(); c.stroke();
    c.beginPath(); c.ellipse(0, -1.3, 1.5, 1.2, 0, Math.PI, 0); c.closePath(); c.fillStyle = "#ff5d73"; c.fill(); c.stroke();
    for (const [ox, oy] of [[-0.7, -1.7], [0.5, -2.1], [0.2, -1.5]]) circle(c, ox, oy, 0.25, "#fff");
  } else if (d.type === "cactus") {
    rrect(c, -0.7, -4, 1.4, 4.2, 0.7); c.fillStyle = "#5cc477"; c.fill(); c.stroke();
    rrect(c, -1.9, -2.8, 0.9, 1.7, 0.45); c.fill(); c.stroke();
    rrect(c, 1.0, -3.3, 0.9, 1.7, 0.45); c.fill(); c.stroke();
    circle(c, 0, -4.1, 0.45, "#ff7ab6", OUTLINE, 0.14);
    c.strokeStyle = "rgba(255,255,255,.6)"; c.lineWidth = 0.15;
    c.beginPath(); c.moveTo(-0.25, -3.5); c.lineTo(-0.25, -0.5); c.stroke();
  } else if (d.type === "rock") {
    c.beginPath(); c.ellipse(0, -0.8, 1.7, 1.15, 0, 0, TAU); c.fillStyle = TR.th.rock; c.fill(); c.stroke();
    ellipse(c, -0.5, -1.3, 0.6, 0.3, "rgba(255,255,255,.4)");
  } else if (d.type === "pine") {
    rrect(c, -0.35, -1.2, 0.7, 1.4, 0.2); c.fillStyle = "#9a6a45"; c.fill(); c.stroke();
    for (const [y, w] of [[-1, 2.2], [-2.6, 1.8], [-4, 1.3]]) {
      c.beginPath(); c.moveTo(-w, y); c.lineTo(w, y); c.lineTo(0, y - 2.2); c.closePath();
      c.fillStyle = "#3e9e78"; c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-w * 0.45, y - 1.2); c.lineTo(w * 0.45, y - 1.2); c.lineTo(0, y - 2.2); c.closePath(); c.fillStyle = "#fff"; c.fill();
    }
  } else if (d.type === "snowman") {
    circle(c, 0, -1.1, 1.3, "#fff", OUTLINE, 0.16);
    circle(c, 0, -2.9, 0.9, "#fff", OUTLINE, 0.16);
    rrect(c, -0.9, -2.25, 1.8, 0.4, 0.18); c.fillStyle = "#ff5d73"; c.fill();
    circle(c, -0.3, -3.05, 0.12, OUTLINE); circle(c, 0.3, -3.05, 0.12, OUTLINE);
    c.beginPath(); c.moveTo(0, -2.85); c.lineTo(0.7, -2.75); c.lineTo(0, -2.65); c.fillStyle = "#ff9f1c"; c.fill();
  }
  c.restore();
}

function drawHead(c, r, t) {
  // 로컬 좌표: +x가 앞쪽
  const fur = r.fur, ear = r.ear;
  c.lineWidth = 0.12; c.strokeStyle = OUTLINE;
  if (ear === "pointy") {
    for (const sy of [-1, 1]) {
      c.beginPath(); c.moveTo(-0.05, sy * 0.25); c.lineTo(-0.85, sy * 0.78); c.lineTo(-0.2, sy * 0.62); c.closePath();
      c.fillStyle = fur; c.fill(); c.stroke();
      c.beginPath(); c.moveTo(-0.2, sy * 0.38); c.lineTo(-0.66, sy * 0.68); c.lineTo(-0.25, sy * 0.56); c.closePath(); c.fillStyle = r.inner || "#fff"; c.fill();
    }
  } else if (ear === "long") {
    for (const sy of [-1, 1]) {
      c.save(); c.translate(-0.6, sy * 0.3); c.rotate(sy * 0.25);
      c.beginPath(); c.ellipse(-0.45, 0, 0.75, 0.24, 0, 0, TAU); c.fillStyle = fur; c.fill(); c.stroke();
      c.beginPath(); c.ellipse(-0.45, 0, 0.55, 0.11, 0, 0, TAU); c.fillStyle = r.inner; c.fill();
      c.restore();
    }
  } else if (ear === "round") {
    for (const sy of [-1, 1]) { circle(c, -0.3, sy * 0.55, 0.27, fur, OUTLINE, 0.12); circle(c, -0.3, sy * 0.55, 0.13, r.inner || "#f6b8a0"); }
  } else if (ear === "floppy") {
    for (const sy of [-1, 1]) { c.beginPath(); c.ellipse(-0.2, sy * 0.66, 0.42, 0.22, sy * 0.4, 0, TAU); c.fillStyle = r.inner; c.fill(); c.stroke(); }
  } else if (ear === "antenna") {
    c.beginPath(); c.moveTo(-0.2, 0); c.lineTo(-0.95, 0.35 * Math.sin(t * 4)); c.stroke();
    circle(c, -0.95, 0.35 * Math.sin(t * 4), 0.16, "#ff7ab6", OUTLINE, 0.1);
  }
  circle(c, 0, 0, 0.62, fur, OUTLINE, 0.12);
  if (ear === "frog") {
    for (const sy of [-1, 1]) { circle(c, 0.2, sy * 0.38, 0.27, "#fff", OUTLINE, 0.1); circle(c, 0.29, sy * 0.38, 0.12, OUTLINE); }
  } else {
    for (const sy of [-1, 1]) { circle(c, 0.36, sy * 0.22, 0.09, OUTLINE); circle(c, 0.38, sy * 0.19, 0.03, "#fff"); }
    circle(c, 0.5, 0, 0.07, "#5a3a3a");
  }
  for (const sy of [-1, 1]) circle(c, 0.24, sy * 0.42, 0.11, "rgba(255,120,150,.55)");
}

function drawKart(c, k, t) {
  const r = k.racer;
  const hv = k.heading - (k.driftVis || 0) + (k.spinVis || 0);
  const rot = Math.atan2(Math.cos(hv), Math.sin(hv));
  const sc = Math.max(1.45, 5 / cam.s) * (1 + (k.hopT > 0 ? Math.sin((1 - k.hopT / 0.25) * Math.PI) * 0.15 : 0));
  c.save(); c.translate(k.x, k.z);
  ellipse(c, 0.3 * sc, 0.5 * sc, 1.9 * sc, 1.4 * sc, "rgba(40,30,60,.2)");
  c.rotate(rot); c.scale(sc, sc);
  // 부스트 불꽃
  if (k.boostT > 0) {
    const f = 0.8 + Math.random() * 0.5;
    c.beginPath(); c.moveTo(-1.45, -0.45); c.quadraticCurveTo(-2.6 * f, 0, -1.45, 0.45); c.closePath(); c.fillStyle = "#ff9f1c"; c.fill();
    c.beginPath(); c.moveTo(-1.45, -0.25); c.quadraticCurveTo(-2.1 * f, 0, -1.45, 0.25); c.closePath(); c.fillStyle = "#fff3a3"; c.fill();
  }
  // 바퀴
  c.fillStyle = "#3b3355";
  for (const [wx, wy, front] of [[0.95, -1.0, 1], [0.95, 1.0, 1], [-0.95, -1.0, 0], [-0.95, 1.0, 0]]) {
    c.save(); c.translate(wx, wy); if (front) c.rotate(-(k.steerVis || 0) * 0.4);
    rrect(c, -0.45, -0.24, 0.9, 0.48, 0.18); c.fill(); c.restore();
  }
  // 차체
  rrect(c, -1.4, -0.88, 2.9, 1.76, 0.62); c.fillStyle = hex(r.color); c.fill();
  c.lineWidth = 0.13; c.strokeStyle = OUTLINE; c.stroke();
  rrect(c, 0.75, -0.5, 0.6, 1.0, 0.3); c.fillStyle = "rgba(255,255,255,.55)"; c.fill();
  rrect(c, -1.6, -1.0, 0.36, 2.0, 0.16); c.fillStyle = OUTLINE; c.fill();
  circle(c, 0.95, 0, 0.2, "#fff6e6", OUTLINE, 0.08);
  const face = ART.racers[k.ri];
  if (!face) drawHead(c, r, t);
  // 방패
  if (k.shieldT > 0) {
    circle(c, 0, 0, 2.15, `rgba(127,230,255,${0.22 + Math.sin(t * 8) * 0.06})`, "rgba(255,255,255,.8)", 0.12);
    circle(c, -0.6, -0.9, 0.35, "rgba(255,255,255,.6)");
  }
  c.restore();
  if (face) {
    const h = 3.0 * sc, w = h * (face.width / face.height), bob = Math.sin(t * 9 + k.ri) * 0.08 * sc;
    c.drawImage(face, k.x - w / 2, k.z - h * 0.78 + bob, w, h);
  }
  // 스핀 중 머리 위 별
  if (k.spinT > 0) {
    for (let i = 0; i < 3; i++) {
      const a = t * 6 + i * 2.1;
      drawStar(c, k.x + Math.cos(a) * 1.3 * sc, k.z + Math.sin(a) * 0.7 * sc - 0.4 * sc, 0.38 * sc, "#ffd23f");
    }
  }
}
function drawStar(c, x, y, r, col) {
  c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fillStyle = col; c.fill(); c.lineWidth = r * 0.18; c.strokeStyle = OUTLINE; c.stroke();
}

function draw() {
  if (!TR) return;
  const th = TR.th, s = cam.s, t = performance.now() / 1000;
  const cx = VW / 2, cy = VH / 2 - viewOffY;
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.fillStyle = th.grass; c.fillRect(0, 0, VW, VH);
  const x0 = cam.x - cx / s - 8, x1 = cam.x + (VW - cx) / s + 8, z0 = cam.z - cy / s - 8, z1 = cam.z + (VH - cy) / s + 8;
  const inView = (x, z, m) => x > x0 - m && x < x1 + m && z > z0 - m && z < z1 + m;
  c.setTransform(DPR * s, 0, 0, DPR * s, DPR * (cx - cam.x * s), DPR * (cy - cam.z * s));
  // 잔디 줄무늬
  c.fillStyle = th.grass2;
  for (let x = Math.floor(x0 / 16) * 16; x < x1; x += 16) c.fillRect(x, z0, 8, z1 - z0);
  // 꽃
  for (const f of TR.flowers) {
    if (!inView(f.x, f.z, 1)) continue;
    if (th.deco === "tree") { for (let i = 0; i < 5; i++) circle(c, f.x + Math.cos(i * 1.26) * 0.32 * f.s, f.z + Math.sin(i * 1.26) * 0.32 * f.s, 0.24 * f.s, f.c); circle(c, f.x, f.z, 0.17 * f.s, "#ffd23f"); }
    else circle(c, f.x, f.z, 0.3 * f.s, f.c);
  }
  // 구름 그림자
  for (const cl of TR.clouds) {
    if (!inView(cl.x, cl.z, cl.s * 2)) continue;
    for (const [ox, oz, rr] of [[-0.8, 0, 0.7], [0, -0.3, 0.9], [0.9, 0.1, 0.65]]) ellipse(c, cl.x + ox * cl.s, cl.z + oz * cl.s, rr * cl.s, rr * cl.s * 0.65, "rgba(60,50,110,.05)");
  }
  // 도로
  c.lineJoin = "round"; c.lineCap = "round";
  c.save(); c.translate(0.6, 0.9); c.strokeStyle = "rgba(40,30,60,.12)"; c.lineWidth = W + 4; c.stroke(TR.path); c.restore();
  c.strokeStyle = "#ffffff"; c.lineWidth = W + 3; c.stroke(TR.path);
  c.setLineDash([2.2, 2.2]); c.strokeStyle = th.curb; c.stroke(TR.path); c.setLineDash([]);
  c.strokeStyle = "#ffffff"; c.lineWidth = W + 0.5; c.stroke(TR.path);
  c.strokeStyle = th.road; c.lineWidth = W - 0.5; c.stroke(TR.path);
  c.setLineDash([3, 4]); c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 0.45; c.stroke(TR.path); c.setLineDash([]);
  // 출발선
  {
    const p = TR.P[0], tg = TR.T[0];
    c.save(); c.translate(p.x, p.z); c.rotate(Math.atan2(tg.z, tg.x));
    for (let i = 0; i < Math.round(W / 1.2); i++) for (let j = 0; j < 2; j++) {
      c.fillStyle = (i + j) % 2 ? "#ffffff" : OUTLINE;
      c.fillRect(-1.2 + j * 1.2, -W / 2 + i * 1.2, 1.2, 1.2);
    }
    for (const sy of [-1, 1]) circle(c, 0, sy * (W / 2 + 2.6), 1.1, "#ff4f8b", OUTLINE, 0.18);
    c.restore();
  }
  // 범퍼
  for (const b of TR.bumpers) {
    if (!inView(b.x, b.z, 1)) continue;
    circle(c, b.x, b.z, 0.75, b.c, OUTLINE, 0.14);
    circle(c, b.x - 0.22, b.z - 0.22, 0.22, "rgba(255,255,255,.7)");
  }
  // 오일
  for (const h of hazards) {
    if (!inView(h.x, h.z, 3)) continue;
    c.beginPath();
    for (let i = 0; i < 9; i++) { const a = i / 9 * TAU, rr = 1.6 + Math.sin(i * 2.7 + h.x) * 0.3; c.lineTo(h.x + Math.cos(a) * rr, h.z + Math.sin(a) * rr * 0.8); }
    c.closePath(); c.fillStyle = "#2b2140"; c.fill();
    ellipse(c, h.x - 0.5, h.z - 0.4, 0.5, 0.2, "rgba(170,160,255,.6)");
  }
  // 젬
  for (const g of TR.gems) {
    if (g.respawn > 0 || !inView(g.x, g.z, 2)) continue;
    const bob = Math.sin(t * 4 + g.ph) * 0.18, w = 0.55 * Math.abs(Math.cos(t * 2 + g.ph)) + 0.2;
    ellipse(c, g.x, g.z + 0.5, 0.5, 0.18, "rgba(40,30,60,.15)");
    c.beginPath(); c.moveTo(g.x, g.z - 0.85 + bob); c.lineTo(g.x + w, g.z + bob); c.lineTo(g.x, g.z + 0.85 + bob); c.lineTo(g.x - w, g.z + bob); c.closePath();
    c.fillStyle = "#49e4ff"; c.fill(); c.lineWidth = 0.12; c.strokeStyle = OUTLINE; c.stroke();
    circle(c, g.x - w * 0.3, g.z - 0.25 + bob, 0.12, "#fff");
  }
  // 선물 상자
  for (const b of TR.boxes) {
    if (b.respawn > 0 || !inView(b.x, b.z, 3)) continue;
    const wob = Math.sin(t * 3 + b.off) * 0.15, hue = (boxHue * 360 + b.off * 20) % 360;
    c.save(); c.translate(b.x, b.z); c.rotate(wob);
    ellipse(c, 0.2, 0.9, 1.1, 0.4, "rgba(40,30,60,.18)");
    rrect(c, -1.05, -1.05, 2.1, 2.1, 0.45); c.fillStyle = `hsl(${hue},85%,66%)`; c.fill(); c.lineWidth = 0.14; c.strokeStyle = OUTLINE; c.stroke();
    c.fillStyle = "#fff"; c.fillRect(-0.2, -1.05, 0.4, 2.1); c.fillRect(-1.05, -0.2, 2.1, 0.4);
    for (const sx of [-1, 1]) { c.beginPath(); c.ellipse(sx * 0.42, -1.1, 0.42, 0.24, sx * 0.5, 0, TAU); c.fill(); c.stroke(); }
    c.restore();
  }
  // 파티클 (바닥)
  for (const p of particles) {
    if (p.kind !== "dust" && p.kind !== "smoke") continue;
    const a = p.life / p.max;
    c.globalAlpha = a * 0.8;
    circle(c, p.x, p.z, p.size * (1.6 - a), p.color);
  }
  c.globalAlpha = 1;
  // 장식(뒤쪽) + 카트 + 장식(앞쪽): 화면 아래에 있을수록 나중에 그림
  const ks = [...K].sort((a, b) => a.z - b.z);
  let ki = 0;
  for (const d of TR.decor) {
    while (ki < ks.length && ks[ki].z < d.z) { drawKart(c, ks[ki], t); ki++; }
    if (inView(d.x, d.z, 8)) drawDecor(c, d);
  }
  while (ki < ks.length) { drawKart(c, ks[ki], t); ki++; }
  // 로켓
  for (const r of rockets) {
    c.save(); c.translate(r.x, r.z); c.rotate(r.ang);
    ellipse(c, 0.2, 0.8, 1.2, 0.4, "rgba(40,30,60,.18)");
    c.beginPath(); c.moveTo(-1.2, -0.42); c.lineTo(0.6, -0.42); c.quadraticCurveTo(1.6, 0, 0.6, 0.42); c.lineTo(-1.2, 0.42); c.closePath();
    c.fillStyle = "#ff3b4e"; c.fill(); c.lineWidth = 0.13; c.strokeStyle = OUTLINE; c.stroke();
    circle(c, 0.25, 0, 0.2, "#fff", OUTLINE, 0.08);
    c.beginPath(); c.moveTo(-1.2, -0.42); c.lineTo(-1.7, -0.85); c.lineTo(-0.7, -0.42); c.moveTo(-1.2, 0.42); c.lineTo(-1.7, 0.85); c.lineTo(-0.7, 0.42); c.fillStyle = "#ffd23f"; c.fill();
    c.restore();
  }
  // 파티클 (위)
  for (const p of particles) {
    if (p.kind === "dust" || p.kind === "smoke") continue;
    const a = p.life / p.max;
    c.globalAlpha = Math.min(1, a * 1.5);
    if (p.kind === "sparkle") drawStar(c, p.x, p.z, p.size * (0.6 + a), p.color);
    else circle(c, p.x, p.z, p.size * (p.kind === "boom" ? 1.8 - a : 1), p.color);
  }
  c.globalAlpha = 1;
  // 이름표 (화면 좌표)
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.font = "13px Jua, sans-serif"; c.textAlign = "center"; c.textBaseline = "middle";
  const showAll = s > 3;
  for (const k of K) {
    if (!showAll && !k.isPlayer) continue;
    const sx = cx + (k.x - cam.x) * s, sy = cy + (k.z - cam.z) * s - Math.max(ART.racers[k.ri] ? 34 : 26, (ART.racers[k.ri] ? 3.6 : 2.8) * s * Math.max(1.45, 5 / s) / 1.45);
    if (sx < -40 || sx > VW + 40 || sy < -20 || sy > VH + 20) continue;
    const label = k.isPlayer && S.state !== "attract" ? `▼ ${k.racer.name}` : k.racer.name;
    const w = c.measureText(label).width + 12;
    rrect(c, sx - w / 2, sy - 9, w, 18, 9);
    c.fillStyle = k.isPlayer && S.state !== "attract" ? "#ffd23f" : "rgba(255,246,230,.85)"; c.fill();
    c.lineWidth = 2; c.strokeStyle = OUTLINE; c.stroke();
    c.fillStyle = OUTLINE; c.fillText(label, sx, sy + 1);
  }
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!S.paused && S.state !== "results") {
    const n = S.state === "attract" ? 1 : S.sel.speed;
    for (let i = 0; i < n; i++) step(dt);
    tickFeed(dt);
  } else if (S.state === "results") updateCamera(dt);
  castTick();
  draw();
  requestAnimationFrame(loop);
}

// ═════════════ 시작 ═════════════
function boot(data) {
  drawCasterFace($("casterFace"));
  loadArt();
  if (data && data.sel) Object.assign(S.sel, data.sel);
  startAttract();
  viewTitle();
  requestAnimationFrame((t) => { last = t; loop(t); });
}
window.claude?.hot?.snapshot?.(() => ({ sel: S.sel }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
